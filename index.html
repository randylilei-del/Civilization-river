civ: {
'米诺斯·迈锡尼': { n:'Minoan–Mycenaean', b:'Bronze Age palace civilizations of the Aegean, undone by the great collapse.', d:'Crete built Europe\'s first palace civilization, trading with Egypt and the Levant; mainland Mycenae inherited and conquered it — the world behind the Trojan legends. The systemic collapse around 1200 BCE buried it for three millennia until archaeology recovered it.', f:{ 'Peak':'c. 1450 BCE', 'Center':'Knossos, Mycenae', 'Legacy':'Linear A/B, palace economy' } },
'古希腊': { n:'Ancient Greece', b:'City-states that invented democracy, philosophy and drama; Hellenism reached Central Asia.', d:'Hundreds of rival city-states produced astonishing originality in philosophy, science, art and politics. After repelling Persia came the golden age; after the Peloponnesian War, Macedon absorbed them — and Alexander spread Greek culture to Egypt and Central Asia.', f:{ 'Peak':'5th c. BCE (Age of Pericles)', 'Center':'Athens, Sparta', 'Figures':'Socrates, Plato, Aristotle', 'Legacy':'Democracy, philosophy, drama, Olympics' } },
'罗马': { n:'Rome', w:'Roman Empire', b:'From republic to empire, the whole Mediterranean in one polity; its law and language shaped Europe.', d:'From a small city on the Tiber, Rome expanded through legions, law and an inclusive citizenship until the Mediterranean was its inner lake. Two centuries of Pax Romana followed the Principate; after the 3rd-century crisis the west fell in 476 — but Roman law, Latin and the Church shaped all later Europe.', f:{ 'Peak':'117 CE (Trajan)', 'Center':'Rome', 'Figures':'Caesar, Augustus, Trajan', 'Legacy':'Roman law, Latin, roads & aqueducts' } },
'拜占庭': { n:'Byzantium', w:'Byzantine Empire', b:'The eastern empire endured a thousand years, preserving classical learning.', d:'After the west fell, the eastern empire lasted another millennium; Justinian briefly retook the western Mediterranean and codified Roman law. Squeezed by Persians, Arabs and Turks, sacked by the Fourth Crusade in 1204, it fell in 1453 — its Greek manuscripts fed the Renaissance, its Orthodoxy passed to Russia.', f:{ 'Peak':'6th c. (Justinian)', 'Center':'Constantinople', 'Figures':'Justinian, Basil II', 'Legacy':'Corpus Juris Civilis, Hagia Sophia' } },
'中世纪西欧': { n:'Medieval West', w:'Middle Ages', b:'Church and Germanic kingship assemble a new order; knights, cathedrals, universities.', d:'On Roman ruins, Germanic kingship and the Church assembled a new order — Charlemagne\'s coronation revived the imperial idea. Amid feudal fragmentation Europe slowly accumulated: land clearance, reviving towns, universities and Gothic cathedrals, banking five centuries of potential.', f:{ 'Peak':'13th century', 'Center':'Paris, Rome', 'Figures':'Charlemagne, Aquinas', 'Legacy':'Universities, Gothic architecture' } },
'文艺复兴意大利': { n:'Renaissance Italy', w:'Italian Renaissance', b:'Merchant city-states bankroll the rediscovery of the classical world.', d:'City-states fattened on Mediterranean trade spent their wealth on art and learning, rediscovering antiquity; humanism turned the gaze from God to man. Politically fragmented, Italy became the battlefield of France and Spain while the Atlantic powers took the lead.', f:{ 'Peak':'c. 1500', 'Center':'Florence, Venice', 'Figures':'The Medici, Leonardo, Michelangelo', 'Legacy':'Humanism, perspective, double-entry bookkeeping' } },
'西班牙·葡萄牙': { n:'Spain & Portugal', w:'Spanish Empire', b:'First movers of the Age of Sail; the first global empire.', d:'Forged by the Reconquista, the two Iberian kingdoms sailed first: Portugal around Africa to India, Spain into the Americas — a papal line divided the globe between them. American silver poured in without becoming productive power; after the Armada\'s defeat, hegemony passed to the Dutch and English.', f:{ 'Peak':'late 16th c. (Philip II)', 'Center':'Lisbon, Madrid', 'Figures':'Henry the Navigator, Columbus, Magellan', 'Legacy':'New sea routes, first global empire' } },
'荷兰': { n:'Dutch Republic', b:'The 17th-century "wagoner of the seas", inventor of the joint-stock company.', d:'The seven provinces that broke from Spain ruled the 17th century through shipping and financial innovation: the VOC was history\'s first joint-stock company and Amsterdam the world\'s money center. Naval primacy passed to England, but Dutch commercial institutions were inherited by everyone.', f:{ 'Peak':'mid-17th c. (Golden Age)', 'Center':'Amsterdam', 'Legacy':'VOC, stock exchange' } },
'法兰西': { n:'France', b:'Twice master of the continent; exporter of Enlightenment and revolution.', d:'The Sun King\'s Versailles set the model for European courts and the philosophes\' salons incubated revolution; 1789 and Napoleon exported liberty, equality and the Code across Europe. Twice broken by Germany, France remained the political-cultural core of Europe and now co-drives the EU.', f:{ 'Peak':'1812 (Napoleon)', 'Center':'Paris', 'Figures':'Louis XIV, Voltaire, Napoleon, de Gaulle', 'Legacy':'Enlightenment, Napoleonic Code' } },
'大英帝国·英国': { n:'British Empire', b:'Cradle of the Industrial Revolution; the 19th century\'s global hegemon.', d:'The island state rose through navy, commerce and parliament, defeating Spain, Holland and France to command the oceans; it lit the Industrial Revolution and became the world\'s workshop and the empire on which the sun never set. Two world wars drained it, yet English, common law and its trade-finance rules remain the world\'s base protocols.', f:{ 'Peak':'1870–1914', 'Center':'London', 'Figures':'Elizabeth I, Watt, Victoria, Churchill', 'Legacy':'Industrial Revolution, parliamentary politics' } },
'德意志': { n:'Germany', b:'Unified in 1871; industry and science supreme, twice the epicenter of world war.', d:'Bismarck unified Germany through three wars; the new empire\'s steel, chemicals and universities led Europe. The bid for "a place in the sun" ignited two world wars and two defeats; postwar manufacturing rebuilt it into the EU\'s economic core.', f:{ 'Peak':'early 20th c.', 'Center':'Berlin', 'Figures':'Bismarck, Einstein (German science)', 'Legacy':'Modern university, chemical industry, social insurance' } },
'俄罗斯·苏联': { n:'Russia / USSR', w:'Soviet Union', b:'The Eurasian land empire; superpower rival of America for half a century.', d:'Muscovy shed the Golden Horde and expanded to the Pacific; Peter the Great forced westernization. After 1917 the planned economy industrialized at speed, broke the Nazi war machine, and split the world with America for forty years until the 1991 collapse.', f:{ 'Peak':'1945–1980', 'Center':'Moscow, St. Petersburg', 'Figures':'Peter the Great, Catherine II, Lenin, Stalin', 'Legacy':'First satellite and human spaceflight' } },
'苏美尔·阿卡德': { n:'Sumer & Akkad', w:'Sumer', b:'First cities and writing; Akkad, the first empire.', d:'The Sumerians invented writing, cities, schools and proto-law — practically defining "civilization"; Sargon of Akkad first welded the city-states into an empire. Their legacy persists in every hour of sixty minutes.', f:{ 'Peak':'24th c. BCE (Sargon)', 'Center':'Uruk, Ur, Akkad', 'Legacy':'Cuneiform, the wheel, base-60, Gilgamesh' } },
'古埃及': { n:'Ancient Egypt', b:'Three millennia of pharaohs along the Nile.', d:'The Nile\'s regular flood gave Egypt rare stability: thirty dynasties without losing its character. The pyramids were more ancient to Cleopatra than she is to us. Persia, Greece and Rome took it in turn until the Ptolemies\' final curtain.', f:{ 'Peak':'New Kingdom (1550–1069 BCE)', 'Center':'Memphis, Thebes', 'Figures':'Khufu, Ramesses II, Cleopatra', 'Legacy':'Pyramids, hieroglyphs, solar calendar' } },
'赫梯': { n:'Hittites', b:'Anatolian chariot power; early masters of iron.', d:'The Hittites fought Egypt to a draw at Kadesh and signed the oldest surviving peace treaty. When the Bronze Age collapse destroyed the kingdom, its ironworking scattered — opening the Iron Age.', f:{ 'Peak':'14th c. BCE', 'Center':'Hattusa', 'Legacy':'Ironworking, first international treaty' } },
'亚述·巴比伦': { n:'Assyria & Babylon', w:'Assyria', b:'Hammurabi\'s law and Assyria\'s war machine; the Hanging Gardens.', d:'Hammurabi\'s stele is the source of "an eye for an eye"; Assyria\'s iron armies built the first empire spanning Mesopotamia and Egypt, and Nineveh\'s library preserves what we know of it. New Babylon\'s brilliance was brief — in 539 BCE it fell to Cyrus without a fight.', f:{ 'Peak':'7th c. BCE (Assyria)', 'Center':'Babylon, Nineveh', 'Figures':'Hammurabi, Nebuchadnezzar II', 'Legacy':'Code of Hammurabi, Library of Nineveh' } },
'腓尼基': { n:'Phoenicia', b:'Mediterranean traders whose alphabet became the West\'s.', d:'The Levantine port cities traded across the whole Mediterranean and planted Carthage; their 22 bookkeeping letters, once the Greeks added vowels, became nearly every Western script — including the one you are reading.', f:{ 'Peak':'1000–800 BCE', 'Center':'Tyre, Sidon', 'Legacy':'The alphabet, purple dye' } },
'迦太基': { n:'Carthage', b:'Phoenician colony turned western Mediterranean hegemon; destroyed by Rome.', d:'Hannibal crossed the Alps and annihilated Rome\'s army at Cannae — Rome\'s deepest terror. Three Punic Wars later the city was razed; "Carthago delenda est" became the byword for no mercy.', f:{ 'Peak':'early 3rd c. BCE', 'Center':'Carthage', 'Figures':'Hannibal', 'Legacy':'Western Mediterranean trade empire' } },
'波斯(阿契美尼德)': { n:'Achaemenid Persia', w:'Achaemenid Empire', b:'The first superpower spanning three continents.', d:'Cyrus founded the empire on tolerance, freeing the Babylonian captives; Darius ran it from the Indus to the Aegean through satrapies, royal roads and coinage — the largest empire yet seen. Twice checked in Greece, it fell to Alexander, but its statecraft was copied by every successor.', f:{ 'Peak':'Darius I (522–486 BCE)', 'Center':'Persepolis, Susa', 'Figures':'Cyrus, Darius', 'Legacy':'Satrapies, Royal Road, tolerance' } },
'希腊化王朝': { n:'Hellenistic States', w:'Hellenistic period', b:'Alexander\'s successors; Greek culture rules the Near East for three centuries.', d:'Alexander\'s generals carved up his empire, Ptolemies in Egypt and Seleucids in Syria the strongest; Alexandria\'s Library and Museum were the ancient world\'s intellectual hub — Euclid and Archimedes belong to this age. All fell in turn to Rome.', f:{ 'Peak':'3rd c. BCE', 'Center':'Alexandria, Antioch', 'Figures':'Ptolemy I, Euclid, Archimedes', 'Legacy':'Library of Alexandria, Hellenistic science' } },
'罗马治下近东': { n:'Roman Near East', b:'Seven Roman centuries; the cradle of Christianity.', d:'After Pompey\'s conquests the Near East became Rome\'s richest provinces; Christianity was born in Roman Palestine and spread along Roman roads until it captured the empire itself. It remained the Greco-Roman world\'s eastern half until the Arabs came.', f:{ 'Peak':'2nd century', 'Center':'Antioch, Alexandria', 'Legacy':'Provincial prosperity, cradle of Christianity' } },
'帕提亚·萨珊': { n:'Parthia & Sasanids', w:'Sasanian Empire', b:'Persian dynasties that fought Rome for centuries and kept the Silk Road\'s middle gate.', d:'Parthian horse-archers annihilated Crassus at Carrhae; the Sasanids claimed Persia\'s mantle and battled Rome-Byzantium for four hundred years, once capturing an emperor. The long wars bled both sides — the rising Arabs uprooted it in a few years.', f:{ 'Peak':'6th c. (Khosrow I)', 'Center':'Ctesiphon', 'Figures':'Shapur I, Khosrow I', 'Legacy':'Heavy cavalry, Zoroastrian state church' } },
'阿拉伯哈里发': { n:'Arab Caliphates', w:'Abbasid Caliphate', b:'Spain to Central Asia in a century; Baghdad, the world\'s house of learning.', d:'Under Islam\'s banner the Arabs built an empire from Spain to Central Asia within a century; the Abbasid House of Wisdom translated Greek, Persian and Indian learning — algebra and "Arabic numerals" spread west from here. Turkic soldiers took real power from the 10th century; the Mongols ended it at Baghdad in 1258.', f:{ 'Peak':'Harun al-Rashid (786–809)', 'Center':'Damascus → Baghdad', 'Figures':'Muhammad, Harun al-Rashid, al-Khwarizmi', 'Legacy':'Algebra, translation movement, House of Wisdom' } },
'塞尔柱突厥': { n:'Seljuks', w:'Seljuk Empire', b:'Steppe Turks take over West Asia; Manzikert brings on the Crusades.', d:'Steppe Turks converted to Islam and became its sword; at Manzikert in 1071 they captured the Byzantine emperor, and Anatolia turned Turkish — the origin of today\'s Turkey and, indirectly, of the Crusades.', f:{ 'Peak':'Malik-Shah (1072–1092)', 'Center':'Isfahan', 'Legacy':'Manzikert, madrasa system' } },
'伊尔汗国': { n:'Ilkhanate', b:'Mongol Persia; the end of the Abbasids.', d:'Hülegü\'s westward campaign destroyed the Abbasids; the Mongols ruled Persia for eighty years, later converting to Islam. Tabriz became the east-west entrepôt where Chinese painting met the Persian miniature.', f:{ 'Peak':'Ghazan (1295–1304)', 'Center':'Tabriz', 'Legacy':'East-West exchange in art and astronomy' } },
'奥斯曼帝国': { n:'Ottoman Empire', b:'Took Constantinople; three continents for six centuries.', d:'Mehmed II\'s great guns opened the thousand-year capital in 1453; under Suleiman the armies stood before Vienna and the eastern Mediterranean was Ottoman. Conservatism set in; the "sick man" was dismembered after WWI — today\'s Middle East map is largely the parceling of its estate.', f:{ 'Peak':'Suleiman (1520–1566)', 'Center':'Istanbul', 'Figures':'Mehmed II, Suleiman', 'Legacy':'Tri-continental administration' } },
'萨法维·波斯': { n:'Safavid Persia', w:'Safavid dynasty', b:'Made Persia Shia; Isfahan, "half the world".', d:'The Safavids established Shia Islam as state religion, splitting Persia from its Sunni neighbors — the root of today\'s sectarian map; Abbas the Great\'s Isfahan was among the most splendid capitals of the 17th century.', f:{ 'Peak':'Abbas I (1588–1629)', 'Center':'Isfahan', 'Legacy':'Shia state, Isfahan ensemble' } },
'现代中东': { n:'Modern Middle East', w:'Middle East', b:'Nation-states from the Ottoman estate; oil rewrites the weights.', d:'British and French mandates cut today\'s states from the Ottoman corpse; Israel\'s founding brought repeated wars, and oil made the Gulf suddenly rich. Sect, nation and great-power play still intersect here.', f:{ 'Turning point':'1973 oil crisis', 'Center':'Cairo, Riyadh, Tehran, Istanbul', 'Legacy':'OPEC, Suez nationalization' } },
'斯基泰': { n:'Scythians', b:'The first recorded horse nomads; gold art of the steppe.', d:'Herodotus\' unconquerable riders — "no cities to take, no crops to burn" — outlasted even Darius\' invasion; their goldwork is the peak of steppe art, and they set the nomad-vs-sown pattern for two millennia.', f:{ 'Peak':'4th c. BCE', 'Center':'Pontic steppe', 'Legacy':'Mounted archery, animal-style gold' } },
'匈奴': { n:'Xiongnu', b:'The first steppe empire; three centuries sparring with Han China.', d:'Modu unified the tribes and besieged the Han founder at Baideng, extracting tribute for decades; Emperor Wu\'s counteroffensives broke them into southern submission and northern flight. Some scholars link the later European Huns to their descendants — still debated.', f:{ 'Peak':'Modu Chanyu (209–174 BCE)', 'Center':'Mongolian steppe', 'Figures':'Modu Chanyu', 'Legacy':'The steppe-empire model' } },
'匈人': { n:'Huns', b:'Attila at the gates; the migration cascade that broke Rome.', d:'The "Scourge of God" extorted both Romes and swept the Balkans and Gaul; checked at the Catalaunian Plains, dead within two years, his empire dissolved — but the Germanic migrations he set moving could not be stopped.', f:{ 'Peak':'Attila (434–453)', 'Center':'Pannonia', 'Figures':'Attila' } },
'突厥汗国': { n:'Türk Khaganate', w:'First Turkic Khaganate', b:'Six thousand li of steppe road; their descendants remade West Asia.', d:'The Ashina rose in the Altai to rule from Manchuria to the Caspian; split east-west, both halves fell to Tang. The Orkhon inscriptions — regret at trusting Tang honey — are the steppe\'s first written self-account; the westward drift of Turkic peoples later remade West Asia.', f:{ 'Peak':'late 6th c.', 'Center':'Orkhon valley', 'Legacy':'Orkhon script, steppe Silk Road' } },
'粟特': { n:'Sogdia', w:'Sogdia', b:'The people who actually ran the Silk Road.', d:'Nomad empires came and went; the road itself was worked by these Iranian-speaking city merchants. They kept colonies in Chang\'an, Luoyang, the Mongolian steppe and Byzantium — the "Hu merchants" of Chinese sources are mostly them. Their script was borrowed by the Uyghurs, passed to the Mongols, then to the Manchus, and stayed in use into the twentieth century. An Lushan was of Sogdian descent. Turkicization and Islam ended them as a people, but the network they laid down remained.', f:{ 'Peak':'6th–8th c.', 'Center':'Samarkand, Bukhara', 'Legacy':'The Sogdian script; a trans-Eurasian trade network' } },
'柔然': { n:'Rouran', w:'Rouran Khaganate', b:'They invented the title "khagan"; the Turks were their smiths.', d:'For a century and a half they faced down Northern Wei, who called them by a deliberately insulting name. Their leader Shelun was the first to style himself khagan — a title every steppe sovereign would use for the next thousand years, from Turks and Uyghurs to Mongols and Manchus. The Turkic tribes of the Altai forged iron for them as vassals; in 552 those smiths turned and destroyed them in a single war.', f:{ 'Peak':'5th c.', 'Center':'Mongolian steppe', 'Figures':'Shelun Khagan', 'Legacy':'The title "khagan"' } },
'嚈哒·白匈奴': { n:'Hephthalites', w:'Hephthalites', b:'Pressed Sasanian Persia and Gupta India at the same time.', d:'Where they came from is still argued — whether they were a Xiongnu branch has been debated for a century. What is certain is that for one century they held down Sasanian Persia to the west and Gupta India to the south at once: the Persian king Peroz died fighting them, and the Gupta golden age never recovered from their invasions. Around 560 the Turks and Sasanians closed on them from both sides, and they vanished as abruptly as they had appeared.', f:{ 'Peak':'early 6th c.', 'Center':'Bactria (northern Afghanistan)', 'Legacy':'Killed a Persian king, broke a Indian golden age' } },
'萨曼王朝': { n:'Samanid Empire', w:'Samanid Empire', b:'Persian reborn at Bukhara; the cradle of Ibn Sina and al-Biruni.', d:'Two centuries after the Arab conquest, the Persian language — now in Arabic script — came back to life in the Bukhara court, and Ferdowsi\'s Shahnameh caught the whole of Persian memory as it fell. On the same soil Ibn Sina wrote the Canon of Medicine, a European medical-school textbook for the next six hundred years, and al-Biruni calculated the radius of the Earth and wrote an account of India still cited today. For this century and a half the intellectual centre of Islam was not Baghdad but Central Asia.', f:{ 'Peak':'10th c.', 'Center':'Bukhara', 'Figures':'Ibn Sina, al-Biruni, Ferdowsi', 'Legacy':'New Persian literature; the Canon of Medicine' } },
'喀喇汗王朝': { n:'Kara-Khanid Khanate', w:'Kara-Khanid Khanate', b:'The moment the Turks became Muslims.', d:'The first Turkic dynasty to adopt Islam — before this, Turks were shamanists, Manichaeans and Buddhists. It turned Central Asia from an Iranian-speaking world into a Turkic-speaking one: the language map running from Turkey to Xinjiang today starts here. The Kutadgu Bilig and the Diwan Lughat al-Turk are the two earliest substantial books in Turkic, the latter an encyclopedia complete with a world map.', f:{ 'Peak':'11th c.', 'Center':'Kashgar, Balasagun', 'Legacy':'Turkic Islam; the first Turkic books' } },
'花剌子模': { n:'Khwarazmian Empire', w:'Khwarazmian Empire', b:'Killed Genghis Khan\'s envoys and brought him west.', d:'It began as a single Seljuk governorship and within a century was the strongest state in Central Asia; its last ruler styled himself a second Alexander. In 1218 his frontier governor seized a Mongol caravan and executed it, then the envoys sent to complain were killed too. Genghis Khan came west with everything he had: within three years Urgench, Samarkand and Bukhara were rubble, and the irrigation works took centuries to recover. Central Asia\'s prosperity ended at a stroke, over an avoidable diplomatic incident.', f:{ 'Peak':'Muhammad II (1200–1220)', 'Center':'Urgench, Samarkand', 'Legacy':'The spark of the Mongol westward campaign' } },
'西辽·哈剌契丹': { n:'Qara Khitai', w:'Qara Khitai', b:'Khitans rebuilt in the west; one battle shook all Islam.', d:'After the Liao fell to the Jin, Yelu Dashi led a remnant ten thousand li west and rebuilt the state in Central Asia. At Qatwan in 1141 he routed the Seljuk sultan Sanjar; the news reached Europe garbled into a report that an eastern Christian king — Prester John — was crushing the Muslims from behind, and the crusaders waited a full century for the relief army that was never coming. The state itself was Buddhist while ruling a largely Muslim population, and was notably tolerant.', f:{ 'Peak':'Yelu Dashi (1124–1143)', 'Center':'Balasagun', 'Legacy':'Qatwan; multi-faith rule' } },
'哈萨克汗国': { n:'Kazakh Khanate', w:'Kazakh Khanate', b:'"The ones who left" — and the three hordes that became a nation.', d:'In 1465 two sultans led their followers away from the Uzbek khanate and moved east; "Kazakh" means the ones who broke away, the free. The division into Great, Middle and Little Hordes survives to this day as the substrate of Kazakh society. Caught between the Dzungars to the east and Russia to the north, the 1723 Dzungar surprise attack — remembered as the Great Disaster — drove the hordes to seek Russian help one by one, and onto the road to annexation.', f:{ 'Peak':'Kasym Khan (early 16th c.)', 'Center':'Turkestan city', 'Legacy':'The Kasym law code; the three-horde structure' } },
'布哈拉·希瓦·浩罕三汗国': { n:'Uzbek Khanates', w:'Khanate of Bukhara', b:'Three khanates; Central Asia\'s last native states.', d:'Shaybani brought the Uzbeks south and finished the Timurids, after which Central Asia was governed for three centuries by the khanates of Bukhara, Khiva and Kokand. Once sea routes opened, the overland Silk Road withered and the khanates turned inward — though Bukhara remained one of the most madrasa-dense cities in the Muslim world. In the nineteenth century they became the board on which Britain and Russia played the Great Game, and were annexed one after another: the last page of native rule in Central Asia.', f:{ 'Peak':'16th c. and early 19th c.', 'Center':'Bukhara, Khiva, Kokand', 'Legacy':'The Great Game\'s chessboard' } },
'回鹘': { n:'Uyghur Khaganate', b:'Saved the Tang; turned farmer after the fall.', d:'They helped Tang crush the An Lushan rebellion for lucrative silk-horse trade and built rare steppe cities; smashed by the Kyrgyz in 840, they migrated to Gansu and the Tarim, turned agricultural — direct ancestors of today\'s Uyghurs.', f:{ 'Peak':'late 8th c.', 'Center':'Karabalghasun', 'Legacy':'First steppe capital city, Manichaeism' } },
'蒙古帝国': { n:'Mongol Empire', b:'The largest land empire in history, Pacific to Danube.', d:'Genghis Khan reorganized the steppe; three generations conquered from the Pacific to the Danube. Destruction and connection in one: countless cities razed, yet the roads ran safe — Marco Polo and papal envoys came east on them. The four khanates localized and the tide receded, but Eurasia was never fully severed again.', f:{ 'Peak':'c. 1260', 'Center':'Karakorum', 'Figures':'Genghis, Kublai, Batu', 'Legacy':'Largest land empire, the yam post system' } },
'帖木儿帝国': { n:'Timurids', w:'Timurid Empire', b:'Victor from Delhi to Ankara; Samarkand\'s splendor.', d:'Timur, self-styled heir of Genghis, won from Delhi to Ankara and captured the Ottoman sultan, dying en route to invade Ming China. His grandson Ulugh Beg\'s star tables amazed later European astronomers; his great-great-grandson Babur founded the Mughals.', f:{ 'Peak':'c. 1400', 'Center':'Samarkand', 'Figures':'Timur, Ulugh Beg', 'Legacy':'Samarkand ensemble, observatory' } },
'准噶尔': { n:'Dzungars', w:'Dzungar Khanate', b:'The last steppe empire, ground down by three Qing reigns.', d:'The last nomad empire fought Kangxi, Yongzheng and Qianlong for seventy years before annihilation. In the age of muskets and cannon the mounted archer\'s edge was gone — the two-thousand-year steppe-empire era ended here.', f:{ 'Peak':'Galdan (1670s–90s)', 'Center':'Ili valley' } },
'俄国治下中亚': { n:'Russian Central Asia', w:'Russian Turkestan', b:'Tsars and Soviets absorb the steppe; the Great Game.', d:'Russia swallowed the steppe and Transoxiana through the 19th century, playing the Great Game against British India across the Pamirs; Soviet rule forced settlement and cotton monoculture — the Aral Sea nearly died of it. In 1991 five republics emerged.', f:{ 'Center':'Tashkent', 'Keywords':'Great Game, cotton economy' } },
'现代中亚': { n:'Modern Central Asia', w:'Central Asia', b:'Five states between the powers; the corridor is busy again.', d:'Independent since 1991 and wedged between Russia, China and the West, the region is again a strategic corridor — pipelines and Belt-and-Road freight have made the old passage busy again.', f:{ 'Center':'Astana, Tashkent' } },
'印度河文明': { n:'Indus Valley', w:'Indus Valley Civilisation', b:'Gridded drainage cities; script still undeciphered.', d:'The third great river civilization planned its cities better than anyone: straight streets, household drains — yet almost no palaces, temples or signs of war. Its script remains unread and its decline unexplained.', f:{ 'Peak':'c. 2300 BCE', 'Center':'Harappa, Mohenjo-daro', 'Legacy':'Grid cities, standard weights, drainage' } },
'吠陀时代': { n:'Vedic Age', w:'Vedic period', b:'Aryan migration; the Vedas, caste and early Hinduism take shape.', d:'Indo-European speakers moved down from Central Asia; the orally transmitted Rigveda is India\'s oldest text. The four-varna hierarchy took shape, Brahmanism spread along the Ganges — and Buddhism and Jainism soon rebelled from this very soil.', f:{ 'Center':'Indus–Ganges plains', 'Legacy':'The Vedas, Sanskrit, varna system' } },
'孔雀王朝': { n:'Maurya Empire', b:'First unification of the subcontinent; Ashoka sends Buddhism abroad.', d:'Chandragupta unified the north as Alexander withdrew; Ashoka, horrified by the carnage at Kalinga, converted to Buddhism, carved his dharma on pillars across the realm and sent missions as far as the Hellenistic courts and Sri Lanka — Buddhism\'s leap to world religion starts here.', f:{ 'Peak':'Ashoka (268–232 BCE)', 'Center':'Pataliputra', 'Figures':'Chandragupta, Ashoka', 'Legacy':'First unification, edict pillars' } },
'百乘王朝': { n:'Satavahana Empire', w:'Satavahana dynasty', b:'The Deccan\'s first great empire — north India in one hand, Roman shipping in the other.', d:'After the Mauryas collapsed, this Brahmin dynasty rose on the Deccan plateau and filled a four-century gap between north and south. It held one hand out to the Ganges kingdoms and the other to Rome\'s Indian Ocean trade — most of the Roman gold coins dug up in south India belong to this era. The court funded Brahmin sacrifice and endowed Buddhist monasteries at the same time; the reliefs of the Amaravati stupa, soft and flowing, are a strand of Buddhist art quite separate from Gandhara.', f:{ 'Peak':'early 2nd c.', 'Center':'Pratishthana, Amaravati', 'Figures':'Gautamiputra Satakarni', 'Legacy':'The Amaravati stupa; India\'s earliest lead coinage' } },
'贵霜帝国': { n:'Kushan Empire', b:'Steppe-born lords of the Silk Road crossroads; the first Buddha images.', d:'The Yuezhi, pushed out by the Xiongnu, built an empire at the Silk Road\'s crossroads and grew rich on it; under Kanishka\'s patronage Greek craftsmen first carved the Buddha in human form — born not in India\'s heartland but in this Greco-Indo-steppe hybrid.', f:{ 'Peak':'Kanishka (2nd c.)', 'Center':'Peshawar', 'Legacy':'Gandhara art, Silk Road hub' } },
'笈多王朝': { n:'Gupta Empire', b:'India\'s classical golden age: Sanskrit letters, zero and decimals.', d:'Classical Hindu culture crystallized here: Kalidasa\'s drama, Aryabhata\'s astronomy and mathematics; zero and decimal notation traveled west via the Arabs to become humanity\'s arithmetic — perhaps India\'s greatest gift. The White Huns broke the empire and India returned to its many kingdoms.', f:{ 'Peak':'Chandragupta II (380–415)', 'Center':'Pataliputra', 'Figures':'Kalidasa, Aryabhata', 'Legacy':'Zero & decimals, classical Sanskrit literature' } },
'中世纪诸王朝': { n:'Medieval Kingdoms', w:'Medieval India', b:'Many kingdoms, exporting culture to Southeast Asia.', d:'After Harsha\'s brief reunification the subcontinent settled into centuries of Rajput and southern dynasties; political division didn\'t stop cultural export — these are the centuries when Hinduism and Buddhism deeply shaped Southeast Asia by sea.', f:{ 'Center':'Kannauj, the Deccan' } },
'朱罗王朝': { n:'Chola Empire', w:'Chola dynasty', b:'Tamil sea power; fleets to Srivijaya.', d:'The Tamil maritime empire of south India sent fleets to the Malay peninsula and Srivijaya — rare naval power in Indian history; its bronze Dancing Shiva remains Indian art\'s calling card.', f:{ 'Peak':'Rajendra I (1014–1044)', 'Center':'Thanjavur', 'Legacy':'Ocean fleets, bronze Nataraja' } },
'德里苏丹国': { n:'Delhi Sultanate', b:'Turko-Afghan Islam rules the north for three centuries.', d:'Turko-Afghan soldiery built an Islamic state over north India, five dynasties in succession; it stopped the Mongols at the Indus but was wrecked by Timur\'s sack. Indo-Islamic architecture and Urdu trace here.', f:{ 'Peak':'early 14th c.', 'Center':'Delhi', 'Legacy':'Indo-Islamic architecture, roots of Urdu' } },
'莫卧儿帝国': { n:'Mughal Empire', b:'A quarter of the world economy at peak; the Taj is its footnote.', d:'Babur, Timur\'s heir, took Delhi with guns; Akbar abolished the poll tax and married Rajput allies, and the empire peaked — Shah Jahan built the Taj for his empress. Aurangzeb\'s wars and rigidity hollowed it; a British company found its opening.', f:{ 'Peak':'Akbar to Aurangzeb (16th–17th c.)', 'Center':'Agra, Delhi', 'Figures':'Akbar, Shah Jahan, Aurangzeb', 'Legacy':'Taj Mahal, tolerant statecraft (Akbar)' } },
'英属印度': { n:'British Raj', b:'From company to crown; the jewel and its cost.', d:'A trading company ate the subcontinent by mercenaries and treaties; after the 1857 revolt the Crown ruled directly. Railways and telegraphs stitched India together while wealth drained to London; Gandhi\'s nonviolence mobilized millions to independence — and Partition\'s million dead.', f:{ 'Peak':'c. 1900', 'Center':'Calcutta → New Delhi', 'Figures':'Clive; Gandhi (resistance)', 'Legacy':'Railway & telegraph net (double-edged)' } },
'印度·南亚诸国': { n:'India & South Asia', w:'India', b:'Partition, wars, then the world\'s most populous rising power.', d:'Three India-Pakistan wars and mutual nuclear tests followed Partition; liberalization in 1991 unleashed IT-led growth. In 2023 India passed China as the most populous nation — one of the century\'s most watched rising powers.', f:{ 'Center':'New Delhi, Mumbai, Bangalore', 'Legacy':'IT services, world\'s largest elections' } },
'扶南': { n:'Funan', b:'The Mekong delta\'s first Indianized state; early global entrepôt.', d:'Known from Chinese envoys\' accounts, Funan held the sea route\'s choke point; its port Óc Eo has yielded Roman coins and Han mirrors — globalization\'s first reach into the region. Its Sanskrit kingship set Southeast Asia\'s pattern.', f:{ 'Center':'Óc Eo (Mekong delta)', 'Legacy':'First Indianized kingship in SE Asia' } },
'三佛齐': { n:'Srivijaya', b:'Six centuries taxing the Strait of Malacca.', d:'The Sumatran sea empire lived off the Malacca Strait for six centuries; the pilgrim Yijing studied Sanskrit here and ranked its Buddhist learning with India\'s. The Chola raid of 1025 broke its grip; Java and Malacca inherited the trade.', f:{ 'Peak':'9th–10th c.', 'Center':'Palembang', 'Legacy':'Strait control, Mahayana scholarship' } },
'高棉·吴哥': { n:'Khmer / Angkor', w:'Khmer Empire', b:'Hydraulic city of perhaps a million; Angkor Wat.', d:'Angkor\'s kings tamed the monsoon with vast reservoirs and canals, feeding possibly a million people; Angkor Wat shifted from Vishnu temple to Buddhist shrine — religious strata in stone. Siamese pressure and failing waterworks emptied it; the jungle kept it four hundred years.', f:{ 'Peak':'12th c.', 'Center':'Angkor', 'Legacy':'Angkor Wat, giant waterworks' } },
'大越': { n:'Đại Việt', b:'Independent of China yet Confucian to the core; thrice repelled the Mongols.', d:'Independent in 939 after a millennium of Chinese rule, yet it kept Chinese script, examinations and Confucian governance — the sinosphere\'s southern edge. It repelled the Mongols three times and pushed steadily south over Champa before falling to France.', f:{ 'Center':'Thăng Long (Hanoi)', 'Legacy':'Thrice repelled Mongols, chữ Nôm' } },
'满者伯夷': { n:'Majapahit', b:'Java\'s island hegemon; blueprint of Indonesia\'s imagined map.', d:'Founded after repelling Kublai\'s fleet, at peak it claimed most of the archipelago — the historical blueprint of modern Indonesia\'s map. It fell as Islamic sultanates rose; its Hindu remnant still lives on Bali.', f:{ 'Peak':'mid-14th c. (Gajah Mada)', 'Center':'east Java', 'Legacy':'Loose archipelago hegemony' } },
'马六甲及诸苏丹国': { n:'Malacca & Sultanates', w:'Malacca Sultanate', b:'Spice entrepôt and Islam\'s gateway to the archipelago.', d:'A small port backed by Zheng He\'s fleet became the spice trade\'s clearing-house and Islam\'s distribution point — Malay became the archipelago\'s lingua franca. Portugal took the city in 1511, but Islamization was already irreversible.', f:{ 'Peak':'late 15th c.', 'Center':'Malacca', 'Legacy':'Malay as lingua franca' } },
'暹罗': { n:'Siam', w:'Thailand', b:'Heir of Angkor; the only uncolonized state in the region.', d:'Ayutthaya inherited the mainland after Angkor\'s fall, warring with Burma for centuries; alone in Southeast Asia it kept independence by playing Britain against France — trading edge territories for the core\'s sovereignty.', f:{ 'Center':'Ayutthaya → Bangkok', 'Legacy':'Diplomatic survival between empires' } },
'欧洲殖民东南亚': { n:'Colonial SE Asia', b:'Iberian start, Dutch spice, British-French carve-up; broken by 1942.', d:'Portugal and Spain began it, the Dutch monopolized spice, Britain took Malaya and Burma, France Indochina, America the Philippines; Japan\'s months-long sweep in WWII shattered the myth of white invincibility — independence followed within a decade.', f:{ 'Center':'Batavia, Manila, Saigon', 'Keywords':'Spices, rubber, tin' } },
'现代东南亚': { n:'Modern SE Asia', w:'ASEAN', b:'From war to ASEAN; the supply chain\'s new hub.', d:'Through the Vietnam War and Cold War turmoil, ASEAN (1967) chose collective pragmatism; Singapore leapt from entrepôt to global financial center. Six hundred million people are again where they were before the Age of Sail — at the crossroads of world trade.', f:{ 'Center':'Jakarta, Singapore, Bangkok, Hanoi', 'Legacy':'ASEAN, the Singapore miracle' } },
'二里头·夏': { n:'Erlitou / Xia', w:'Erlitou culture', b:'Earliest broad kingship in the Central Plain — the proto-China.', d:'Palace precincts, bronze jue cups and a turquoise dragon: Erlitou in the Luoyang basin is the Central Plain\'s earliest broad kingship. Whether it is the textual "Xia" is debated — but the prototype of "China" is already here.', f:{ 'Center':'Erlitou (Luoyang basin)', 'Legacy':'Earliest palace city and bronze rites' } },
'商': { n:'Shang', w:'Shang dynasty', b:'Oracle bones and bronzes: the root of Chinese writing and rites.', d:'Oracle-bone script is the direct ancestor of Chinese characters, making Shang the start of China\'s recorded history; its bronze casting has never been surpassed — the Houmuwu ding weighs over 800 kg. Fu Hao, queen and general, is the boneyard\'s most vivid figure.', f:{ 'Peak':'Wu Ding (13th c. BCE)', 'Center':'Yin (Anyang)', 'Figures':'Wu Ding, Fu Hao', 'Legacy':'Oracle-bone script, ritual bronzes' } },
'西周': { n:'Western Zhou', b:'Feudal enfeoffment and the Mandate of Heaven.', d:'After the conquest of Shang, the Duke of Zhou codified rites and the Mandate of Heaven — the baseline of Chinese political philosophy for three millennia. The "Gonghe regency" of 841 BCE begins China\'s unbroken chronology; in 771 BCE the capital fell to the Quanrong.', f:{ 'Peak':'Cheng-Kang era', 'Center':'Haojing, Luoyi', 'Figures':'King Wu, Duke of Zhou', 'Legacy':'Feudal rites, Mandate of Heaven' } },
'东周·春秋战国': { n:'Eastern Zhou', w:'Eastern Zhou', b:'Five broken centuries that wrote China\'s intellectual source code.', d:'With the court reigning in name only, hegemons rose and states devoured one another; yet exactly this chaos produced Confucius, Laozi, the Legalists and Mohists — nearly all of China\'s source code. Iron plows spread, proto-counties appeared, and Shang Yang\'s reformed Qin finally won.', f:{ 'Peak':'Hundred Schools (6th–3rd c. BCE)', 'Center':'Luoyi and the states\' capitals', 'Figures':'Confucius, Laozi, Shang Yang, Qu Yuan', 'Legacy':'The Hundred Schools, reform movements' } },
'秦': { n:'Qin', w:'Qin dynasty', b:'Fifteen years that installed China\'s operating system.', d:'Ten years to conquer six states; one script, one axle-width, commanderies everywhere — China\'s default OS installed in fifteen years. Its harshness was equally unprecedented: the First Emperor died and the realm rose; two reigns and it fell, but Han inherited the system whole.', f:{ 'Peak':'221–210 BCE', 'Center':'Xianyang', 'Figures':'Qin Shi Huang, Li Si', 'Legacy':'Unified script and measures, commanderies' } },
'西汉': { n:'Western Han', w:'Han dynasty', b:'Rest, then expansion: the Silk Road opens; Rome\'s counterpart.', d:'Han kept Qin\'s frame but softened it; the wealth stored by Wen and Jing was spent by Emperor Wu on driving back the Xiongnu, opening the Western Regions and installing Confucian orthodoxy. In 60 BCE the Protectorate of the Western Regions formalized the Silk Road; in the end Wang Mang took the throne by "abdication."', f:{ 'Peak':'Emperor Wu (141–87 BCE)', 'Center':'Chang\'an', 'Figures':'Liu Bang, Emperor Wu, Zhang Qian, Sima Qian', 'Legacy':'Silk Road, Confucian state, the Records' } },
'东汉': { n:'Eastern Han', w:'Han dynasty', b:'Restoration, paper, Buddhism — then eunuchs, warlords, Yellow Turbans.', d:'Guangwu rebuilt the Han at Luoyang; Ban Chao mastered the Western Regions with thirty-six men, Cai Lun perfected paper, Buddhism arrived on the Silk Road. Later the court rotted between consort clans and eunuchs; the Yellow Turbans rose and the warlords with them — the Three Kingdoms\' prologue.', f:{ 'Peak':'Ming-Zhang era (57–88)', 'Center':'Luoyang', 'Figures':'Guangwu, Ban Chao, Cai Lun, Zhang Heng', 'Legacy':'Paper, Buddhism\'s arrival' } },
'三国': { n:'Three Kingdoms', b:'Wei, Shu and Wu — sixty years magnified a thousandfold by legend.', d:'Red Cliffs fixed the tripod: Wei on the plain, Shu in Sichuan, Wu on the Yangtze. Zhuge Liang died on his fifth northern campaign; Wei took Shu, Jin took Wei and then Wu. Sixty years of history — and China\'s most beloved epic ever since.', f:{ 'Peak':'229–263', 'Center':'Luoyang, Chengdu, Jianye', 'Figures':'Cao Cao, Liu Bei, Sun Quan, Zhuge Liang', 'Legacy':'The southern frontier opened' } },
'西晋': { n:'Western Jin', w:'Jin dynasty (266–420)', b:'Brief reunification, then princes\' wars and the fall of Luoyang.', d:'The Sima clan reunified the realm, then armed its princes: sixteen years of internecine war invited the Xiongnu in. Luoyang fell in 311 — the "Yongjia catastrophe" — and the northern gentry fled south en masse.', f:{ 'Peak':'Taikang era (280–289)', 'Center':'Luoyang', 'Figures':'Sima Yan', 'Legacy':'A reunification that failed' } },
'东晋·十六国': { n:'E. Jin & 16 Kingdoms', w:'Sixteen Kingdoms', b:'The north churns; the south holds at the Fei River.', d:'Sixteen short-lived northern regimes churned while the émigré court held the south; at the Fei River in 383, eighty thousand beat a claimed million and preserved the southern line. Wang Xizhi\'s Orchid Pavilion and Faxian\'s pilgrimage both belong to this turbulent age.', f:{ 'Center':'Jiankang; northern capitals', 'Figures':'Wang Dao, Xie An, Wang Xizhi, Fu Jian', 'Legacy':'The Yangtze south developed; calligraphy\'s peak' } },
'南北朝': { n:'N. & S. Dynasties', w:'Northern and Southern dynasties', b:'Southern letters, northern reforms; the grotto-Buddha age.', d:'Four southern courts cultivated letters while the Xianbei north moved to Luoyang and sinicized wholesale; the equal-field and garrison-militia systems — two pillars of Sui-Tang — were cast in the north. The Yungang and Longmen Buddhas rose above the wars.', f:{ 'Center':'Jiankang; Pingcheng → Luoyang', 'Figures':'Emperor Xiaowen, Emperor Wu of Liang', 'Legacy':'Grotto Buddhas, equal-field system' } },
'隋': { n:'Sui', w:'Sui dynasty', b:'Reunification, the Grand Canal, the examination system.', d:'Wendi ended three centuries of division and created the ministries and examinations; Yangdi cut the Grand Canal, welding China\'s south to its north. Three failed Korean wars bled the people; like Qin, Sui died in two reigns — and like Qin, its systems lived on.', f:{ 'Peak':'Kaihuang era', 'Center':'Daxing (Chang\'an)', 'Figures':'Emperor Wen, Emperor Yang', 'Legacy':'Grand Canal, examinations' } },
'唐': { n:'Tang', w:'Tang dynasty', b:'The open empire at its height; Chang\'an, capital of the world.', d:'Taizong was hailed Heavenly Khagan; million-strong Chang\'an thronged with Sogdian merchants, Japanese envoys and pilgrim monks. An Lushan\'s revolt halved the splendor, warlords and eunuchs finished it — but the examinations, the law codes and Tang poetry had already shaped all East Asia.', f:{ 'Peak':'Kaiyuan era (713–741)', 'Center':'Chang\'an, Luoyang', 'Figures':'Taizong, Wu Zetian, Li Bai, Du Fu', 'Legacy':'Heavenly Khagan order, Tang poetry' } },
'五代十国': { n:'Five Dynasties', w:'Five Dynasties and Ten Kingdoms period', b:'Five northern regimes, ten southern states, one fatal land cession.', d:'Five dynasties cycled through the north in seventy years while ten states split the south; in 936 Shi Jingtang ceded the Sixteen Prefectures to the Khitan, leaving the plain defenseless for four hundred years. The south, meanwhile, quietly prospered.', f:{ 'Center':'Kaifeng; southern capitals', 'Figures':'Chai Rong (Zhou Shizong)', 'Legacy':'The southern economy matures' } },
'北宋': { n:'Northern Song', w:'Song dynasty', b:'The commercial revolution: paper money, movable type, the Qingming scroll.', d:'A cup of wine dissolved the generals\' commands and civil officials ruled; peace was bought from Liao and Xia while the economy hit a premodern world peak — the first paper money, night markets without curfew, Shen Kuo\'s science. Jingkang ended it overnight.', f:{ 'Peak':'Renzong era (mid-11th c.)', 'Center':'Kaifeng', 'Figures':'Zhao Kuangyin, Wang Anshi, Su Shi, Shen Kuo', 'Legacy':'Paper money, movable type, firearms' } },
'南宋': { n:'Southern Song', w:'Song dynasty', b:'Half the land, twice the trade; Neo-Confucianism codified.', d:'With half the realm lost it grew richer: maritime customs at Quanzhou funded the state and the compass led ships to Persia and Africa; Zhu Xi\'s synthesis became East Asia\'s orthodoxy for six centuries. Allying with the Mongols against Jin repeated the old mistake — after Yashan, the child emperor was carried into the sea.', f:{ 'Peak':'late 12th c.', 'Center':'Lin\'an (Hangzhou)', 'Figures':'Yue Fei, Zhu Xi, Xin Qiji', 'Legacy':'Maritime trade, Neo-Confucian canon' } },
'辽': { n:'Liao', w:'Liao dynasty', b:'The Khitan dual empire; a century of bought peace with Song.', d:'Abaoji founded his state half a century before the Song; after the Chanyuan treaty the two powers traded for a hundred peaceful years. Dual administration — steppe law for the steppe, Chinese law for the sown — became the template for Jin, Yuan and Qing; "Khitan" became Russia\'s very word for China.', f:{ 'Peak':'post-Chanyuan', 'Center':'Shangjing; Nanjing (Beijing)', 'Figures':'Abaoji, Empress Xiao', 'Legacy':'Dual administration, Khitan script' } },
'西夏': { n:'Western Xia', b:'The Tangut state astride the Silk Road corridor.', d:'Li Yuanhao proclaimed empire and an intricate script of his own, playing Song, Liao and Jin off one another for nearly two centuries while taxing the Silk Road. Genghis Khan died on the final campaign against it; the Mongol destruction was so thorough that Tangut civilization was only rediscovered in the 20th century.', f:{ 'Peak':'12th c.', 'Center':'Xingqing (Yinchuan)', 'Figures':'Li Yuanhao', 'Legacy':'Tangut script, corridor trade' } },
'金': { n:'Jin (Jurchen)', w:'Jin dynasty (1115–1234)', b:'From 2,500 riders to master of north China; Beijing\'s first capital era.', d:'Aguda rose with 2,500 men, destroyed Liao in a decade and carried off two Song emperors the next year; the move to Yanjing began Beijing\'s history as a capital. Shizong\'s reign was called a "little Yao and Shun," but the dilemma of sinicization was never solved — Mongols and Song ended it at Caizhou.', f:{ 'Peak':'Shizong\'s Dading era', 'Center':'Zhongdu (Beijing)', 'Figures':'Aguda, Emperor Shizong', 'Legacy':'Beijing as capital' } },
'元': { n:'Yuan', w:'Yuan dynasty', b:'The steppe rules all China; the province system endures.', d:'The first whole-China rule from the steppe; its province system is still in use. Persian cobalt colored the blue-white porcelain and Marco Polo\'s Khanbaliq gave Europe its first systematic image of China. Ninety-seven years — among the shortest of the unified dynasties.', f:{ 'Peak':'Kublai (1271–1294)', 'Center':'Dadu (Beijing)', 'Legacy':'Province system, blue-white porcelain, zaju drama' } },
'明': { n:'Ming', w:'Ming dynasty', b:'Zheng He sailed a century before Columbus — then the court turned inward.', d:'Zheng He\'s treasure fleets sailed nearly a century before Columbus at many times the scale, then stopped dead when the court turned inward — the dividend of the sea passed to Europe. Late-Ming Jiangnan boomed on silver and market towns before fiscal collapse met the Little Ice Age.', f:{ 'Peak':'Yongle (1403–1424)', 'Center':'Nanjing → Beijing', 'Figures':'Zhu Yuanzhang, Yongle, Zheng He, Wang Yangming', 'Legacy':'Treasure fleets, Forbidden City, Yangming philosophy' } },
'清': { n:'Qing', w:'Qing dynasty', b:'The High Qing set China\'s modern map; then a century of crisis.', d:'The Kangxi-Qianlong age passed 300 million people and fixed the modern territorial base including Xinjiang and Tibet; but closure and technical stagnation opened an invisible gap. After 1840 the gunboats came — treaties, cessions, indemnities — "a change unseen in three thousand years."', f:{ 'Peak':'18th century', 'Center':'Beijing', 'Figures':'Kangxi, Qianlong, Cao Xueqin', 'Legacy':'Modern territory & multiethnic state, Dream of the Red Chamber' } },
'朝鲜半岛': { n:'Korea', w:'History of Korea', b:'A thousand-year thread: Silla, Goryeo, Joseon.', d:'After Silla\'s unification, Goryeo and Joseon each ran five centuries — Confucian and examination-based like China yet distinct: Goryeo cast movable metal type two centuries before Gutenberg, and Sejong\'s hangul is among the most scientific scripts. Annexed by Japan in 1910; divided since the war.', f:{ 'Center':'Gyeongju, Kaesong, Hanyang', 'Legacy':'Goryeo celadon, metal type, hangul' } },
'日本': { n:'Japan', b:'Learned from Tang, closed under the shoguns, leapt with Meiji.', d:'Embassies to Tang brought wholesale learning, digested into mono no aware and bushidō; two closed Tokugawa centuries ended with the Black Ships, and the Meiji generation westernized in one lifetime — defeating Qing and Russia to join the powers, then burning down in militarism and two atomic bombs. Postwar Japan chose economics and nearly caught America.', f:{ 'Peak':'1980s (economy)', 'Center':'Kyoto, Edo/Tokyo', 'Figures':'Prince Shōtoku, Tokugawa Ieyasu, Emperor Meiji', 'Legacy':'Meiji Restoration, postwar miracle' } },
'韩国': { n:'South Korea', b:'The Miracle on the Han; chips and K-culture.', d:'From postwar ruins poorer than Ghana, one generation industrialized — the Miracle on the Han; today it leads in semiconductors and shipbuilding and exports its pop culture worldwide, the most successful late-development case of the century.', f:{ 'Center':'Seoul', 'Legacy':'Semiconductors, shipbuilding, K-pop' } },
'民国': { n:'Republic of China', w:'Republic of China (1912–1949)', b:'Thirty-seven years of warlords, enlightenment, war and civil war.', d:'The 1911 revolution ended two millennia of empire, but the republic staggered: amid warlord wars the New Culture and May Fourth movements lit an intellectual awakening; nominal unification in 1928 was followed by Japan\'s advance. Fourteen years of resistance ended in victory and a UN founding seat — then four years of civil war.', f:{ 'Center':'Nanjing; Chongqing (wartime)', 'Figures':'Sun Yat-sen, Chiang Kai-shek, Lu Xun', 'Legacy':'New Culture movement, war of resistance' } },
'共和国': { n:'People\'s Republic', w:'China', b:'Reform ignites history\'s largest industrialization; center stage again.', d:'The first three decades built the industrial base and the bomb through great turbulence; the 1978 reforms then ignited history\'s largest industrialization and urbanization — hundreds of millions out of poverty in forty years. China is back at center stage, in a new two-power tension with America.', f:{ 'Turning point':'Reform & Opening 1978', 'Center':'Beijing, Shanghai, Shenzhen', 'Figures':'Mao Zedong, Deng Xiaoping', 'Legacy':'Forty years of growth, mass poverty exit' } },
'库施·努比亚': { n:'Kush / Nubia', w:'Kingdom of Kush', b:'The Black Pharaohs; a thousand years on the upper Nile.', d:'The upper-Nile kingdom once ruled all Egypt as the 25th "Black Pharaoh" dynasty; from Meroë it ran its own script and ironworks, trading with Rome and Aksum for over a thousand years.', f:{ 'Peak':'8th c. BCE', 'Center':'Napata, Meroë', 'Legacy':'Meroitic script, early iron center' } },
'阿克苏姆': { n:'Aksum', w:'Kingdom of Aksum', b:'Red Sea trade power; among the first Christian states.', d:'Astride the Red Sea trade, Aksum minted its own gold across the Indian Ocean; King Ezana adopted Christianity before Rome made it official — the root of the Ethiopian church. It faded when Arabs took the Red Sea, but its royal line was claimed down to the last emperor in 1974.', f:{ 'Peak':'Ezana (4th c.)', 'Center':'Aksum', 'Legacy':'Giant stelae, own gold coinage' } },
'加纳帝国': { n:'Ghana Empire', b:'First lord of the gold-for-salt trade.', d:'Saharan caravans swapped northern salt for southern gold and the Ghana kings taxed the crossing — Arab traders wrote that even the king\'s dogs wore gold collars. Islam and literacy came south with the caravans.', f:{ 'Center':'Koumbi Saleh', 'Legacy':'Salt-gold trade system' } },
'斯瓦希里城邦': { n:'Swahili Coast', w:'Swahili coast', b:'City-states linking Africa to the Indian Ocean world.', d:'Bantu and Arab-Persian traders blended into the Swahili language and a chain of merchant cities shipping ivory and gold to India and China — Zheng He\'s fleet called here, and Kilwa still yields Chinese porcelain. The Portuguese ended the golden age.', f:{ 'Center':'Kilwa, Mombasa, Zanzibar', 'Legacy':'Swahili language, ocean trade net' } },
'大津巴布韦': { n:'Great Zimbabwe', b:'The stone city of the south; gold and cattle.', d:'Dry-stone walls without mortar form sub-Saharan Africa\'s largest ancient structure, a kingdom of gold and cattle trading to the Swahili coast. Colonial Europeans refused to believe Africans built it; today it names the nation.', f:{ 'Center':'Great Zimbabwe', 'Legacy':'Largest ancient structure in southern Africa' } },
'马里帝国': { n:'Mali Empire', b:'Mansa Musa\'s gold; Timbuktu\'s manuscripts.', d:'Mansa Musa\'s pilgrimage scattered so much gold that Cairo\'s price sagged for years — often called the richest man ever; Timbuktu\'s colleges and hundreds of thousands of manuscripts prove sub-Saharan Africa was never "a continent without writing."', f:{ 'Peak':'Mansa Musa (1312–1337)', 'Center':'Niani, Timbuktu', 'Figures':'Sundiata, Mansa Musa', 'Legacy':'Timbuktu scholarship' } },
'刚果王国': { n:'Kingdom of Kongo', w:'Kingdom of Kongo', b:'A Christian kingdom in central Africa — the first to correspond with European monarchs as an equal.', d:'When Portuguese ships reached the mouth of the Congo in 1483, the king sent envoys to Lisbon on his own initiative. His son Afonso I was baptized, learned Latin, and exchanged letters with the king of Portugal as "brother" for decades — that correspondence is among the earliest modern records written by an African in his own voice. But the same ships brought the slave trade. Afonso spent his last years writing letter after letter begging Lisbon to stop the taking of his people; none was answered. Hollowed out, the kingdom broke apart after its defeat at Mbwila in 1665.', f:{ 'Peak':'late 15th – early 16th c.', 'Center':'Mbanza Kongo', 'Figures':'Afonso I (Nzinga Mbemba)', 'Legacy':'State letters to Europe; written Kikongo' } },
'桑海帝国': { n:'Songhai Empire', b:'West Africa\'s largest empire, felled by muskets.', d:'Successor to Mali and West Africa\'s largest empire, with provinces and a standing army; in 1591 a Moroccan force crossed the Sahara with firearms and broke it in one battle — a brutal footnote to the military revolution.', f:{ 'Peak':'Askia Muhammad (1493–1528)', 'Center':'Gao', 'Legacy':'Provincial administration' } },
'欧洲殖民非洲': { n:'Colonial Africa', w:'Scramble for Africa', b:'Three slave-trade centuries, then the ruler-drawn carve-up.', d:'After three centuries of the slave trade took over ten million people, the 1884 Berlin Conference carved the continent with rulers — only Ethiopia and Liberia escaped. Under a century of rule redrew borders, languages and economies whose fault lines still run today.', f:{ 'Turning point':'Berlin Conference 1884', 'Center':'Cape Town, Algiers, Dakar', 'Keywords':'Triangular trade, ruler borders' } },
'现代非洲': { n:'Modern Africa', w:'Africa', b:'Fifty-plus states; the world\'s youngest continent.', d:'Ghana led in 1957 and seventeen states followed in 1960 alone; after Cold War proxy wars and adjustment pains, several of this century\'s fastest growers are African. Median age under 20 — the next demographic dividend lives here.', f:{ 'Turning point':'"Year of Africa" 1960', 'Center':'Lagos, Nairobi, Johannesburg' } },
'奥尔梅克': { n:'Olmec', b:'Mesoamerica\'s mother culture; the colossal heads.', d:'Out of jungle swamps rose the "mother civilization": ten-ton basalt heads carved for no one knows whom; calendar, ballgame and feathered-serpent belief all start here, inherited wholesale by Maya and Aztec.', f:{ 'Center':'San Lorenzo, La Venta', 'Legacy':'Colossal heads, calendar origins' } },
'查文文化': { n:'Chavin', w:'Chavin culture', b:'The Andean mother culture — the common source of every Peruvian civilization after it.', d:'The Andean counterpart to the Olmec, and the common ancestor of everything that followed in Peru. Deep in the underground galleries of Chavin de Huantar stands the Lanzon, a deity fusing human, cat and serpent, revealed in darkness and the sound of water. That imagery spread along the coast and through the highlands — the first time the Andes shared a single religion across regions. Metalwork, weaving and irrigation techniques were fixed here too, and were still in use eighteen centuries later under the Inca.', f:{ 'Peak':'500–300 BCE', 'Center':'Chavin de Huantar', 'Legacy':'The first pan-regional religious art style in the Andes' } },
'玛雅': { n:'Maya', w:'Maya civilization', b:'Script, zero and precise calendars — without metal or the wheel.', d:'Without metal tools or the wheel they measured the year more precisely than the Julian calendar and invented zero independently; dozens of city-states rose and fell until the 9th-century classic collapse — still unexplained. The Maya never vanished: millions of descendants speak Mayan today.', f:{ 'Peak':'Classic (250–900)', 'Center':'Tikal, Palenque, Chichén Itzá', 'Legacy':'The Americas\' only full script, zero' } },
'特奥蒂瓦坎': { n:'Teotihuacan', b:'"City of the gods", the Americas\' metropolis.', d:'At peak perhaps 100,000+ people — among the world\'s largest cities of its day, its influence reaching Maya courts hundreds of kilometers away; its builders remain unidentified. The Aztecs, finding ruins, named it "where the gods were born."', f:{ 'Peak':'c. 450', 'Center':'Teotihuacan', 'Legacy':'Sun & Moon pyramids, grid city' } },
'瓦里·蒂瓦纳科': { n:'Wari & Tiwanaku', w:'Tiwanaku', b:'Andean twin powers; the Inca\'s rough draft.', d:'The Andean twin powers fed high-altitude populations with terraces and raised fields; their roads and administration were the draft the Inca later wrote over.', f:{ 'Center':'Wari; Lake Titicaca', 'Legacy':'Terraces and road networks' } },
'阿兹特克': { n:'Aztec', w:'Aztec Empire', b:'The lake city that stunned the conquistadors; felled by steel and smallpox.', d:'The island capital fed 200,000+ on floating gardens — the Spanish thought of Venice; but an empire that fed on war and sacrifice made enemies, and Cortés with 600 men, native allies and smallpox destroyed it in two years. Mexico City stands on its ruins; the eagle and serpent are its founding vision.', f:{ 'Peak':'Moctezuma II (1502–1520)', 'Center':'Tenochtitlan', 'Legacy':'Chinampa agriculture, the lake capital' } },
'印加': { n:'Inca', w:'Inca Empire', b:'Four thousand km of empire run on knots and roads.', d:'No writing, no wheel, no iron — yet quipu knots and 40,000 km of stone roads governed 4,000 km and perhaps ten million people. Pizarro\'s 168 men, arriving amid civil war and smallpox, trapped and killed the emperor after taking his golden ransom. Machu Picchu survived intact in the clouds.', f:{ 'Peak':'Huayna Capac (1493–1527)', 'Center':'Cusco', 'Legacy':'Royal roads, Machu Picchu, quipu' } },
'西葡殖民美洲': { n:'Iberian America', w:'Spanish colonization of the Americas', b:'Silver, haciendas and missions; the first global trade loop.', d:'Potosí\'s silver flowed to China by the Manila galleons and to Europe via Seville — the first truly global trade circuit; meanwhile epidemic and forced labor cut indigenous populations by perhaps ninety percent, among history\'s deepest demographic catastrophes.', f:{ 'Center':'Mexico City, Lima', 'Keywords':'Potosí, galleon trade' } },
'美国': { n:'United States', b:'Enlightenment republic to sole superpower.', d:'Thirteen colonies founded a republic on Enlightenment ideas; expansion, immigration and the Civil War\'s aftermath made it the world\'s largest industrial power. Undamaged through two world wars, it topped the order it then built — dollar, carriers, alliances, Silicon Valley — and now faces China in renewed great-power competition.', f:{ 'Peak':'post-1945', 'Center':'Washington, New York, Silicon Valley', 'Figures':'Washington, Lincoln, FDR', 'Legacy':'Written constitution, the Moon, the Internet' } },
'拉丁美洲诸国': { n:'Latin America', b:'Independence won, integration unfinished; culture abundant.', d:'The Bolívars won independence in Napoleon\'s shadow but not integration: caudillos, commodity dependence and debt cycles entangled two centuries. Culturally it never stopped producing — tango to magical realism.', f:{ 'Figures':'Bolívar, San Martín', 'Center':'Mexico City, São Paulo, Buenos Aires' } },
