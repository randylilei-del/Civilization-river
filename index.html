  const yl = p.yk === 'r' ? T('在位 ', 'r. ') : p.yk === 'a' ? T('活跃 ', 'fl. ') : '';
  const meta = `${civ ? cN(civ) : p.c} · ${PGNAME[p.g][li]} · ${yl}${p.ca ? T('约', 'c. ') : ''}${fmtY(p.y[0])}—${fmtY(p.y[1])}`
    + (p.r ? ` · ${T('在位 ', 'r. ')}${fmtY(p.r[0])}—${fmtY(p.r[1])}` : '');
  /* 强调色随所属文明走,人物卡与文明卡在视觉上是同一族 */
  pcBox.style.setProperty('--pc-col', civ ? fill(civ) : 'var(--ink-2)');
  pcBox.innerHTML = `
    <div class="pc-head"><span class="pc-g">${PGLYPH[p.g]}</span>
      <div><h3>${p.n[li]}</h3><div class="pc-sub">${meta}</div></div>
      <button class="pc-x" aria-label="${T('关闭', 'Close')}">×</button></div>
    <p class="pc-t">${p.t[li]}</p>
    <ul class="pc-a">${p.a.map(x => `<li>${x[li]}</li>`).join('')}</ul>
    <p class="pc-s"><b>${T('意义', 'Significance')}</b>${p.s[li]}</p>
    <div class="pc-foot">${civ ? `<span class="pc-civ" data-pgo="${civ.n}">↩ ${cN(civ)}</span>` : ''}${wkA(T('维基百科', 'Wikipedia'), LANG === 'zh' ? (p.w || p.n[0]) : p.n[1])}</div>`;
  pcard.hidden = false;
  pcBox.scrollTop = 0;
  const x = pcBox.querySelector('.pc-x'); if (x) x.focus();
}
const closePerson = () => { pcard.hidden = true; };
pcard.addEventListener('click', e => {
  if (e.target.classList.contains('pc-back') || e.target.classList.contains('pc-x')) { closePerson(); return; }
  /* 从人物卡跳去他所属的文明:关掉小卡,文明卡换内容 */
  const go = e.target.closest && e.target.closest('[data-pgo]');
  if (go) {
    const c = CIVS.find(x => x.n === go.dataset.pgo);
    if (c) { closePerson(); openCiv(c); panel.scrollTop = 0; }
  }
});
/* 人名可用键盘触发(role=button + tabindex=0),空格要 preventDefault 否则页面滚动 */
panel.addEventListener('keydown', e => {
  const pn = e.target.closest && e.target.closest('.pn');
  if (pn && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openPerson(pn.dataset.person); }
});
panel.addEventListener('click', e => {
  if (e.target.classList.contains('p-close')) panel.classList.remove('open');
  const pn = e.target.closest && e.target.closest('.pn');
  if (pn) { openPerson(pn.dataset.person); return; }
  /* 卡内漫游:点同期文明(地图圆点/视野外列表)跳到那个文明的卡片 */
  const go = e.target.closest && e.target.closest('[data-goto]');
  if (go) {
    const c = CIVS.find(x => x.n === go.dataset.goto);
    if (c) { openCiv(c); panel.scrollTop = 0; return; }
  }
  /* 点了才插 iframe:在此之前这个页面对外零请求 */
  const pl = e.target.closest && e.target.closest('.vid-play');
  if (pl) {
    const box = pl.parentElement;
    box.insertAdjacentHTML('afterbegin',
      `<div class="vid-frame"><iframe src="${pl.dataset.src}" allowfullscreen scrolling="no" frameborder="0" referrerpolicy="strict-origin-when-cross-origin" title="${T('纪录片','Documentary')}"></iframe></div>`);
    pl.remove();
  }
});
document.addEventListener('keydown', e => {
  /* Esc 逐层退:先关人物卡,文明卡留着——两层一起关会让人丢失位置 */
  if (e.key !== 'Escape') return;
  if (!pcard.hidden) { closePerson(); return; }
  panel.classList.remove('open');
});

/* ---------- 数据表 ---------- */
function renderTable() {
  document.getElementById('dataTable').innerHTML =
    `<tr><th>${T('区域','Region')}</th><th>${T('文明','Civilization')}</th><th>${T('年代','Period')}</th><th>${T('文明圈','Sphere')}</th><th>${T('简介','Summary')}</th></tr>` +
    CIVS.map(c => `<tr><td>${lName(c.l)}</td>
      <td><span class="dot" style="background:${fill(c)}"></span>${cN(c)}</td>
      <td>${civSpan(c)}</td>
      <td>${sName(c.s)}</td><td style="font-size:12px;color:var(--ink-2)">${cB(c)}</td></tr>`).join('');
}
renderTable();

/* ---------- 语言切换 ---------- */
function applyLang() {
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.getElementById('h1T').textContent = T('文明长河', 'A River of Civilizations');
  document.getElementById('subT').textContent = T('从史前到现代:各区域主导文明的兴衰与往来。厚度 = 区域内相对影响力(示意),颜色 = 所属文明圈。点击任意色带查看详情。',
    'Prehistory to the present: the rise, fall and exchanges of each region\'s dominant civilizations. Thickness = relative regional influence (illustrative); color = civilizational sphere. Click any band for details.');
  document.getElementById('evLbl').textContent = T('交流事件', 'Exchange events');
  document.getElementById('tblSum').textContent = T('数据表视图(全部文明)', 'Data table (all civilizations)');
  document.getElementById('notesT').innerHTML = T(
    '<p>· 时间轴为非线性:史前与上古压缩,近 500 年放大。点击文明圈图例可高亮该文明圈在所有区域的分布(如 1500 年后蓝色涌入美洲,13 世纪绿色横扫欧亚)。</p><p>· 影响力厚度为主观示意估计,用于呈现兴衰节奏与同期对比,非精确度量。数据手工编写,难免疏漏,欢迎指正。</p>',
    '<p>· The time axis is nonlinear: antiquity is compressed, the last 500 years expanded. Click a sphere in the legend to highlight it across all regions (blue flooding the Americas after 1500, green sweeping Eurasia in the 13th century).</p><p>· Band thickness is a subjective, illustrative estimate — for rhythm and comparison, not precise measurement. Hand-curated data; corrections welcome.</p>');
  document.getElementById('zoomOut').textContent = T('⤺ 全景', '⤺ Full view');
  document.getElementById('playBtn').textContent = PB.on ? T('⏸ 暂停', '⏸ Pause') : T('▶ 时光穿梭', '▶ Time travel');
  document.getElementById('pbNowLab').textContent = T('此刻在场', 'On stage now');
  document.getElementById('pbFeedLab').textContent = T('最近发生', 'Recently');
  traceSel.innerHTML = `<option value="">${T('传播追踪:关', 'Trace: off')}</option>` +
    TRACES.map((tr, i) => `<option value="${i}"${curTrace === i ? ' selected' : ''}>${tr.n[LANG === 'zh' ? 0 : 1]}</option>`).join('');
  renderLanes(); renderChips(); renderTable(); buildChart();
  document.querySelectorAll('#langSw button').forEach(b => b.classList.toggle('on', b.dataset.l === LANG));
  if (cur && panel.classList.contains('open')) cur.type === 'civ' ? openCiv(cur.obj) : openEvent(cur.obj);
}
document.getElementById('langSw').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.dataset.l === LANG) return;
  LANG = b.dataset.l;
  try { localStorage.setItem('whviz-lang', LANG); } catch (err) {}
  applyLang();
});
applyLang();

document.getElementById('scroller').scrollLeft = X(-600) - 80;

if ('serviceWorker' in navigator && location.protocol === 'https:')
  navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
