<style>
:root {
  color-scheme: light;
  --surface: #fcfcfb;
  --page: #f9f9f7;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --baseline: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --wash: rgba(11,11,11,0.026);
  --c-west: #2a78d6;
  --c-sino: #eb6834;
  --c-indic: #1baf7a;
  --c-mideast: #eda100;
  --c-meso: #e87ba4;
  --c-steppe: #008300;
  --c-africa: #4a3aa7;
  --c-sea: #e34948;
  /* 地理底图三层:比文明色低一个视觉层级,任何情况下都不该抢过版图 */
  --geo-river: #7ab3d9;
  --geo-range: #b3a48c;
  --geo-desert: #e9dcba;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface: #1a1a19;
    --page: #0d0d0d;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255,255,255,0.10);
    --wash: rgba(255,255,255,0.03);
    --c-west: #3987e5;
    --c-sino: #d95926;
    --c-indic: #1baf7a;
    --c-mideast: #c98500;
    --c-meso: #d55181;
    --c-steppe: #008300;
    --c-africa: #9085e9;
    --c-sea: #e66767;
    --geo-river: #4a7fa3;
    --geo-range: #565044;
    --geo-desert: #494026;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: #1a1a19;
  --page: #0d0d0d;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --baseline: #383835;
  --border: rgba(255,255,255,0.10);
  --wash: rgba(255,255,255,0.03);
  --c-west: #3987e5;
  --c-sino: #d95926;
  --c-indic: #1baf7a;
  --c-mideast: #c98500;
  --c-meso: #d55181;
  --c-steppe: #008300;
  --c-africa: #9085e9;
  --c-sea: #e66767;
  --geo-river: #4a7fa3;
  --geo-range: #565044;
  --geo-desert: #494026;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  line-height: 1.55;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
header { max-width: 1200px; margin: 0 auto; padding: 28px 20px 10px; }
h1 { font-size: 24px; margin: 0 0 2px; letter-spacing: .01em; }
.sub { color: var(--ink-2); font-size: 13.5px; margin: 0; }
.controls {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  max-width: 1200px; margin: 14px auto 10px; padding: 0 20px;
  font-size: 12.5px;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border: 1px solid var(--border); border-radius: 999px;
  background: var(--surface); color: var(--ink-2); cursor: pointer;
  font: inherit; font-size: 12px;
}
.chip .dot { width: 10px; height: 10px; border-radius: 3px; }
.chip.on { border-color: var(--ink-2); color: var(--ink); font-weight: 600; }
.chip:hover { border-color: var(--muted); }
.ctl { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); cursor: pointer; user-select: none; }
.ctl input { accent-color: var(--c-west); }
.lang { margin-left: auto; display: flex; gap: 2px; border: 1px solid var(--border); border-radius: 999px; padding: 2px; }
.lang button { border: 0; background: none; color: var(--ink-2); font: inherit; font-size: 12px; padding: 2px 10px; border-radius: 999px; cursor: pointer; }
.lang button.on { background: var(--wash); color: var(--ink); font-weight: 600; }
.controls select {
  font: inherit; font-size: 12px; background: var(--surface); color: var(--ink-2);
  border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; cursor: pointer;
}
#zoomOut {
  position: absolute; top: 8px; right: 8px; z-index: 3;
  font: inherit; font-size: 12px; padding: 3px 12px; cursor: pointer;
  background: var(--surface); color: var(--ink); border: 1px solid var(--muted); border-radius: 999px;
  box-shadow: 0 2px 8px rgba(0,0,0,.12);
}
/* 排在控件区第一位:手机上 8 个文明圈标签会先换好几行,按钮放后面要往下扒才看得见。
   样式也做成实心胶囊——原先用浏览器默认按钮样式,混在一堆标签里不像能点的东西。 */
.playbtn {
  cursor: pointer; font: inherit; font-size: 12px; font-weight: 600; white-space: nowrap;
  color: var(--surface); background: var(--ink); border: 1px solid var(--ink);
  border-radius: 999px; padding: 4px 14px;
}
.playbtn:hover { opacity: .85; }
.playbtn.on { color: var(--ink); background: var(--surface); border-color: var(--ink-2); }
/* 时光穿梭:底部信息带。三段固定布局,内容再多也不会把年份挤走 */
/* 必须显式写:display:grid 的优先级高于浏览器默认的 [hidden]{display:none},
   不加这一条,信息带从页面加载起就一直挂在屏幕底部,hidden 属性形同虚设。 */
#playbar[hidden] { display: none; }
#playbar {
  position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 25;
  display: grid; grid-template-columns: auto minmax(0,1.15fr) minmax(0,1fr) auto; gap: 14px; align-items: center;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: 0 8px 30px rgba(0,0,0,.20); padding: 10px 14px; font-size: 12px;
}
/* 播放时底部被信息带占掉一条,详情卡和页面都往上让。让位量不能写死:
   文明标签会换行,带高随内容变(实测 60~110px 都有),用 ResizeObserver 量出来喂 --pb-h。 */
body.pb-on #panel { bottom: var(--pb-h, 122px); }
body.pb-on { padding-bottom: var(--pb-h, 122px); }
#playbar .pb-year { display: flex; flex-direction: column; line-height: 1.15; min-width: 92px; }
#playbar .pb-year b { font-size: 21px; font-variant-numeric: tabular-nums; }
#playbar .pb-year span { color: var(--muted); font-size: 11px; }
#playbar .pb-lab { display: block; color: var(--muted); font-size: 10.5px; margin-bottom: 3px; }
#playbar #pbCivs { display: flex; flex-wrap: wrap; gap: 4px 6px; }
#playbar .pb-civ { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
#playbar .pb-civ i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
#playbar #pbFeed { display: flex; flex-direction: column; gap: 2px; min-height: 30px; }
#playbar .pb-item { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#playbar .pb-item.new { animation: pbIn .35s ease both; }
#playbar .pb-item b { font-weight: 600; }
#playbar .pb-item.dim { color: var(--muted); }
@keyframes pbIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { #playbar .pb-item { animation: none; } }
#playbar #pbStop {
  font: inherit; font-size: 15px; line-height: 1; cursor: pointer; padding: 5px 9px;
  background: var(--wash); color: var(--muted); border: 1px solid var(--border); border-radius: 8px;
}
@media (max-width: 860px) {
  #playbar { grid-template-columns: auto 1fr auto; gap: 10px; }
  #playbar .pb-feed { grid-column: 1 / -1; }
}
svg.tr .band { opacity: .13; }
svg.tr .evg { opacity: .2; }
.trstop { cursor: pointer; animation: trIn .45s ease both; }
.trpath { stroke-dasharray: 1; stroke-dashoffset: 1; animation: trFlow .55s ease-out forwards; }
@keyframes trIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes trFlow { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .trstop, .trpath { animation: none; stroke-dashoffset: 0; } }

.chart-wrap { position: relative; max-width: 1200px; margin: 0 auto 8px; padding: 0 20px; }
.chart-card {
  position: relative; background: var(--surface);
  border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
  /* 多层阴影:近处一层锐、远处一层柔,图表卡从页面上"浮"出来 */
  box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 28px rgba(0,0,0,.09);
}
.scroller { overflow-x: auto; overflow-y: hidden; }
svg { display: block; }
.lane-tags { position: absolute; left: 10px; top: 0; pointer-events: none; z-index: 2; }
.lane-tag {
  position: absolute; left: 0; transform: translateY(-50%);
  font-size: 11.5px; font-weight: 600; color: var(--ink-2);
  background: color-mix(in oklab, var(--surface) 82%, transparent);
  padding: 1px 7px; border-radius: 5px; backdrop-filter: blur(2px);
  letter-spacing: .04em; white-space: nowrap;
}

.band { cursor: pointer; transition: opacity .18s, filter .18s; }
/* hover 抬升:色带浮起来一点,像从纸面上被捏起 */
.band:hover { filter: drop-shadow(0 3px 5px rgba(0,0,0,.35)); }
.sheen { transition: opacity .18s; }
svg.hl .sheen, svg.tr .sheen { opacity: .1; }
.evg { cursor: pointer; }
svg.hl .band { opacity: .14; }
svg.hl .band.hit { opacity: 1; }
svg.no-ev .evg { display: none; }
.blabel {
  pointer-events: none; font-weight: 600;
  fill: var(--ink); stroke: var(--surface); stroke-width: 3px; paint-order: stroke;
}

#tip {
  position: fixed; z-index: 10; max-width: 300px; padding: 9px 12px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  box-shadow: 0 6px 24px rgba(0,0,0,.16); font-size: 12.5px; pointer-events: none;
  display: none;
}
#tip .t-name { font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.t-dot { width: 9px; height: 9px; border-radius: 3px; flex: none; display: inline-block; }
#tip .t-span { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
#tip .t-blurb { color: var(--ink-2); margin-top: 3px; }
#tip .t-hint { color: var(--muted); font-size: 11px; margin-top: 5px; border-top: 1px solid var(--grid); padding-top: 4px; }

#panel {
  position: fixed; z-index: 20; top: 16px; right: 16px; bottom: 16px;
  width: clamp(400px, 32vw, 540px);
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,.12), 0 18px 60px rgba(0,0,0,.28); padding: 18px 20px; overflow-y: auto;
  transform: translateX(112%); transition: transform .25s ease; font-size: 13px;
}
#panel.open { transform: none; }
/* 卡片里的曲线/区间条/地图都按 330 的内部坐标系画,靠 viewBox 缩放到面板实际宽度。
   这样面板一放大,图和字一起变大,不用改任何绘制代码里的尺寸计算。 */
#panel .p-spark svg, #panel .p-gl svg, #panel .p-map svg { width: 100%; height: auto; display: block; }
@media (prefers-reduced-motion: reduce) { #panel { transition: none; } }
/* iPad 这类中等屏:372px 的窄条缩在最右边很憋屈,放到接近整屏 */
@media (max-width: 1279px) {
  #panel { width: min(78vw, 760px); font-size: 14px; }
}
@media (max-width: 720px) {
  #panel { left: 8px; right: 8px; width: auto; top: auto; bottom: 8px; max-height: 88vh; transform: translateY(115%); }
  #panel.open { transform: none; }
}
#panel .p-head { display: flex; align-items: center; gap: 8px; }
#panel h2 { font-size: 17px; margin: 0; flex: 1; }
#panel .p-close {
  border: 1px solid var(--border); background: none; color: var(--ink-2);
  border-radius: 7px; width: 26px; height: 26px; cursor: pointer; font-size: 15px; line-height: 1;
}
#panel .p-close:hover { color: var(--ink); border-color: var(--muted); }
#panel .p-meta { color: var(--muted); font-size: 12px; margin: 3px 0 10px; font-variant-numeric: tabular-nums; }
a.wk { color: inherit; text-decoration: underline dotted var(--muted); text-underline-offset: 2.5px; }
a.wk:hover { text-decoration-style: solid; }
a.wk::after { content: '↗'; font-size: .72em; color: var(--muted); margin-left: 1.5px; vertical-align: super; }
/* 站内弹卡的人名:浅底小片、无 ↗——与 a.wk 的"要跳走"形成对比,一眼分得开 */
.pn {
  cursor: pointer; padding: 1px 5px; border-radius: 5px;
  background: color-mix(in oklab, var(--ink) 7%, transparent);
  box-shadow: inset 0 -1px 0 color-mix(in oklab, var(--ink) 22%, transparent);
}
.pn:hover, .pn:focus-visible { background: color-mix(in oklab, var(--ink) 15%, transparent); outline: none; }

/* ---------- 人物卡 ---------- */
#pcard { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 20px; }
/* display:flex 会盖掉 [hidden],必须显式写回来——v21 的 playbar 就栽在这上面 */
#pcard[hidden] { display: none; }
#pcard .pc-back { position: absolute; inset: 0; background: rgba(0,0,0,.42); animation: pcFade .18s ease; }
#pcard .pc-box {
  position: relative; max-width: 460px; width: 100%; max-height: 84vh; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 16px 18px 14px; font-size: 13.5px; line-height: 1.62;
  box-shadow: 0 4px 12px rgba(0,0,0,.18), 0 24px 70px rgba(0,0,0,.34);
  animation: pcIn .2s cubic-bezier(.2,.9,.3,1.1);
}
@keyframes pcFade { from { opacity: 0 } }
@keyframes pcIn { from { opacity: 0; transform: translateY(12px) scale(.97) } }
@media (prefers-reduced-motion: reduce) { #pcard .pc-box, #pcard .pc-back { animation: none } }
#pcard .pc-head { display: flex; align-items: flex-start; gap: 10px; }
#pcard .pc-g { font-size: 26px; line-height: 1.15; flex: none; }
#pcard h3 { margin: 0; font-size: 18px; letter-spacing: .01em; }
#pcard .pc-sub { color: var(--muted); font-size: 11.5px; margin-top: 2px; font-variant-numeric: tabular-nums; }
#pcard .pc-x {
  margin-left: auto; flex: none; background: none; border: 1px solid var(--border); color: var(--muted);
  border-radius: 7px; width: 26px; height: 26px; cursor: pointer; font-size: 15px; line-height: 1;
}
#pcard .pc-x:hover { color: var(--ink); border-color: var(--muted); }
#pcard .pc-t { margin: 11px 0 0; font-weight: 600; }
#pcard .pc-a { margin: 9px 0 0; padding: 0; list-style: none; }
#pcard .pc-a li { position: relative; padding-left: 17px; margin-top: 5px; }
#pcard .pc-a li::before { content: ''; position: absolute; left: 3px; top: .62em; width: 6px; height: 6px; border-radius: 50%; background: var(--pc-col); }
#pcard .pc-s { margin: 11px 0 0; padding: 9px 11px; border-radius: 8px; background: var(--wash); border-left: 3px solid var(--pc-col); }
#pcard .pc-s b { color: var(--pc-col); margin-right: 4px; }
#pcard .pc-foot { display: flex; align-items: center; gap: 14px; margin-top: 13px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 12px; }
#pcard .pc-civ { cursor: pointer; color: var(--ink-2); text-decoration: underline dotted; }
#pcard .pc-civ:hover { color: var(--ink); }
#panel .p-spark { margin: 4px 0 10px; }
#panel .p-map { margin: 2px 0 12px; }
#panel .p-map .cap { color: var(--muted); font-size: 11px; margin-top: 3px; }
#panel .cap span.peer-go { cursor: pointer; text-decoration: underline dotted; color: var(--ink-2); }
#panel .cap span.peer-go:hover { color: var(--ink); }
#panel .p-gl { margin: -4px 0 10px; }
#panel .p-gl .cap { color: var(--muted); font-size: 11px; margin-top: 1px; }
#panel .p-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin: 0 0 12px; }
#panel .fact .today { display: block; margin-top: 2px; font-style: normal; font-size: 10.5px; line-height: 1.35; color: var(--muted); }
#panel .p-vid { margin: 0 0 12px; display: flex; flex-direction: column; gap: 5px; }
#panel .vid-play {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; box-sizing: border-box;
  width: 100%; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; text-decoration: none;
  color: var(--surface); background: var(--ink); border: 0; border-radius: 8px; padding: 9px 12px; text-align: left;
}
#panel .vid-play span { font-weight: 400; font-size: 11.5px; opacity: .7; }
#panel .vid-play:hover { opacity: .85; }
#panel .vid-frame { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: var(--wash); }
#panel .vid-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
/* 原先是 11.5px 的灰色小字,跟在叙述后面——Ray 在手机上根本没找到。
   做成整行的按钮:同一层级的"可点的东西"要长得像可点的东西。 */
#panel .vid-search {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  margin-top: 8px; padding: 9px 12px; font-size: 12.5px; font-weight: 600;
  color: var(--ink); background: var(--wash); border: 1px solid var(--border);
  border-radius: 8px; text-decoration: none;
}
#panel .vid-search span { font-weight: 400; font-size: 11.5px; color: var(--muted); }
#panel .vid-search:hover { border-color: var(--muted); background: var(--surface); }
#panel .fact { background: var(--wash); border-radius: 7px; padding: 6px 9px; }
/* 只管格子自己的标题 span(「人物」「中心」…),不能波及值里的 .pn 人名片——
   写成后代选择器会把人名也变成 block,三个名字各占一行、顿号单独一行 */
#panel .fact > span { display: block; color: var(--muted); font-size: 11px; }
#panel .fact b { font-weight: 600; font-size: 12px; }
#panel .p-body { color: var(--ink-2); font-size: 13px; }
#panel .p-tl { margin-top: 13px; border-top: 1px solid var(--grid); padding-top: 10px; }
#panel .p-tl h3 { font-size: 12px; color: var(--muted); margin: 0 0 7px; font-weight: 600; letter-spacing: .05em; }
#panel .tl-item { display: flex; gap: 9px; margin: 0 0 7px; }
#panel .tl-y { flex: none; width: 50px; text-align: right; color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; padding-top: 1px; }
#panel .tl-item b { font-size: 12.5px; }
#panel .tl-item p { margin: 0; color: var(--ink-2); font-size: 12px; }
#panel .p-evs { margin-top: 14px; border-top: 1px solid var(--grid); padding-top: 10px; }
#panel .p-evs h3 { font-size: 12px; color: var(--muted); margin: 0 0 6px; font-weight: 600; letter-spacing: .05em; }
#panel .p-ev { margin: 0 0 8px; }
#panel .p-ev b { font-size: 12.5px; }
#panel .p-ev .y { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
#panel .p-ev p { margin: 1px 0 0; color: var(--ink-2); font-size: 12px; }

.notes { max-width: 1200px; margin: 0 auto 40px; padding: 0 20px; color: var(--muted); font-size: 12px; }
.notes p { margin: 4px 0; }
details.tbl { max-width: 1200px; margin: 6px auto 24px; padding: 0 20px; font-size: 13px; }
details.tbl summary { cursor: pointer; color: var(--ink-2); }
details.tbl .tbl-scroll { overflow-x: auto; margin-top: 10px; }
table { border-collapse: collapse; min-width: 640px; }
th, td { text-align: left; padding: 5px 12px; border-bottom: 1px solid var(--grid); }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
td { font-variant-numeric: tabular-nums; }
td .dot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; }
</style>

<header>
  <h1 id="h1T">文明长河</h1>
  <p class="sub" id="subT">从史前到现代:各区域主导文明的兴衰与往来。厚度 = 区域内相对影响力(示意),颜色 = 所属文明圈。点击任意色带查看详情。</p>
</header>

<div class="controls">

  d:'亚历山大骤逝后部将瓜分帝国,埃及的托勒密与叙利亚的塞琉古最强;亚历山大里亚的图书馆与缪斯宫是古代世界的学术中枢,欧几里得的几何与阿基米德的力学皆产于这个时代。诸王朝最终相继被罗马吞并,末代君主是克娄巴特拉。' },
{ l:'me', s:'west', v:1, n:'罗马治下近东', k:[[-64,0],[100,.5],[400,.42],[636,0]], b:'近东七百年在罗马治下;基督教在此诞生并扩散。',
  f:{ '鼎盛':'2世纪', '中心':'安条克、亚历山大里亚', '成就':'行省城市繁荣、基督教的摇篮' },
  d:'庞培东征后,近东成为罗马最富庶的行省群;基督教正是在罗马治下的巴勒斯坦诞生,沿罗马的道路与航线传遍帝国,最终反客为主成为国教。7世纪阿拉伯人到来之前,这里一直是希腊-罗马世界的东半壁。' },
{ l:'me', s:'mideast', v:1, n:'帕提亚·萨珊', k:[[-247,0],[-100,.45],[224,.5],[550,.6],[651,0]], b:'与罗马缠斗数百年的波斯王朝,丝路中段的把关人。',
  f:{ '鼎盛':'6世纪(库思老一世)', '中心':'泰西封', '人物':'沙普尔一世、库思老一世', '成就':'重装骑兵、琐罗亚斯德教国教化' },
  d:'帕提亚的铁甲骑射手在卡莱全歼罗马军团;继起的萨珊自命波斯正统,与罗马-拜占庭缠斗四百年互有胜负,甚至俘虏过罗马皇帝。但长期战争两败俱伤,新兴的阿拉伯人在几年之内将其连根拔起。' },
{ l:'me', s:'mideast', v:2, n:'阿拉伯哈里发', k:[[622,0],[661,.7],[800,1],[945,.6],[1100,.4],[1258,0]], b:'百年内从西班牙扩至中亚;巴格达是当时世界的学术之都。',
  f:{ '鼎盛':'哈伦·拉希德(786—809)', '中心':'大马士革→巴格达', '人物':'穆罕默德、哈伦·拉希德、花剌子米', '成就':'代数、翻译运动、智慧宫' },
  d:'伊斯兰旗帜下的阿拉伯人一百年内建立起从西班牙到中亚的帝国;阿拔斯迁都巴格达后,"智慧宫"把希腊、波斯、印度典籍译成阿拉伯语,代数(algebra 一词即来自阿拉伯语)与"阿拉伯数字"由此西传。10世纪后大权旁落突厥军人,1258年蒙古屠巴格达,黄金时代落幕。' },
{ l:'me', s:'steppe', v:0, n:'塞尔柱突厥', k:[[1037,0],[1071,.5],[1150,.4],[1194,0]], b:'草原突厥人入主西亚,一战重创拜占庭,引来十字军。',
  f:{ '鼎盛':'马利克沙(1072—1092)', '中心':'伊斯法罕', '成就':'曼齐刻尔特大捷、经学院体系' },
  d:'草原来的突厥人皈依伊斯兰后,反而成了它的武力担当;1071年曼齐刻尔特之战俘虏拜占庭皇帝,安纳托利亚从此突厥化——今日土耳其的起点,也是间接引发十字军东征的导火索。' },
{ l:'me', s:'steppe', v:2, n:'伊尔汗国', k:[[1256,0],[1260,.5],[1300,.4],[1335,0]], b:'蒙古西征的产物,攻陷巴格达,终结阿拔斯哈里发。',
  f:{ '鼎盛':'合赞汗(1295—1304)', '中心':'大不里士', '成就':'东西天文历法与绘画交流' },
  d:'旭烈兀西征灭阿拔斯,蒙古人统治波斯八十年;后期皈依伊斯兰并推行改革,大不里士成为东西商路枢纽——中国的绘画技法与波斯细密画正是在此相遇。' },
{ l:'me', s:'mideast', v:0, n:'奥斯曼帝国', k:[[1299,0],[1453,.6],[1550,.9],[1683,.7],[1800,.4],[1918,0]], b:'攻陷君士坦丁堡,横跨三洲六百年,一战后解体。',
  f:{ '鼎盛':'苏莱曼大帝(1520—1566)', '中心':'伊斯坦布尔', '人物':'穆罕默德二世、苏莱曼大帝', '成就':'横跨三洲的行政与米利特体系' },
  d:'1453年穆罕默德二世以巨炮轰开千年帝都;苏莱曼时代兵临维也纳,地中海东半尽入其手。此后渐趋保守,19世纪沦为列强口中的"西亚病夫",一战站错队后帝国解体——今日中东的版图,多是其遗产被英法分割的结果。' },
{ l:'me', s:'mideast', v:1, n:'萨法维·波斯', k:[[1501,0],[1600,.5],[1722,.3],[1850,.2],[1925,0]], b:'什叶派波斯的定型者,与奥斯曼东西对峙。',
  f:{ '鼎盛':'阿拔斯大帝(1588—1629)', '中心':'伊斯法罕', '成就':'什叶派国教化、伊斯法罕建筑群' },
  d:'萨法维把什叶派立为国教,从此波斯与逊尼派邻国分道扬镳——今日中东教派格局的源头即在于此;阿拔斯大帝的伊斯法罕号称"半个世界",是17世纪最华丽的都城之一。' },
{ l:'me', s:'mideast', v:0, n:'现代中东', k:[[1918,0],[1950,.35],[1973,.5],[2025,.45]], b:'奥斯曼解体后的民族国家格局;石油改写地缘权重。',
  f:{ '转折':'1973年石油危机', '中心':'开罗、利雅得、德黑兰、伊斯坦布尔', '成就':'OPEC、苏伊士运河国有化' },
  d:'奥斯曼解体后由英法委任统治切割出今日诸国;以色列建国引发数次战争,石油让海湾国家骤富,OPEC一度扼住世界经济的咽喉。教派、民族与大国博弈在此交织,至今仍是世界地缘最敏感的地带。' },
/* 草原·中亚 */
{ l:'st', s:'steppe', v:1, n:'斯基泰', k:[[-900,0],[-600,.4],[-300,.3],[-200,0]], b:'最早见于记载的骑马游牧民,黑海草原的黄金艺术。',
  f:{ '鼎盛':'前4世纪', '中心':'黑海北岸草原', '成就':'骑射战术、动物纹黄金艺术' },
  d:'希罗多德笔下"无城可攻、无粮可焚"的骑马民族,大流士倾波斯之力远征也无功而返;其墓葬出土的黄金饰品是草原艺术的巅峰,也开启了此后两千年游牧与定居世界对峙的基本格局。' },
{ l:'st', s:'steppe', v:0, n:'匈奴', k:[[-300,0],[-200,.6],[-50,.4],[100,.3],[200,0]], b:'首个草原帝国,迫汉和亲修长城,与汉缠斗三百年。',
  f:{ '鼎盛':'冒顿单于(前209—前174)', '中心':'漠北单于庭', '人物':'冒顿单于', '成就':'首创草原帝国体制' },
  d:'冒顿鸣镝弑父、统一诸部,白登之围迫使汉朝和亲纳贡数十年;汉武帝倾国反击后由盛转衰,南匈奴内附、北匈奴西遁。有学者认为几百年后横扫欧洲的匈人即其后裔——若然,这是一次改写两端历史的远距离多米诺。' },
{ l:'st', s:'mideast', v:0, n:'粟特', k:[[-100,0],[200,.25],[600,.4],[750,.3],[800,0]], b:'丝绸之路的实际经营者;撒马尔罕的商人网络铺满欧亚。',
  f:{ '鼎盛':'6—8世纪', '中心':'撒马尔罕、布哈拉', '成就':'粟特文字、跨欧亚商业网络' },
  d:'游牧帝国来了又走,商路却一直由这群说伊朗语的城邦商人在经营。他们在长安、洛阳、蒙古草原、拜占庭都设有聚落,汉文史料里的"胡商"多半是他们;粟特文字被回鹘借去,再传给蒙古、又传给满洲,一路用到二十世纪。安禄山就是粟特人后裔。突厥化与伊斯兰化之后,这个民族不再作为独立群体存在,但它铺的那张网留了下来。' },
{ l:'st', s:'steppe', v:2, n:'柔然', k:[[330,0],[410,.4],[500,.35],[555,0]], b:'"可汗"称号的创造者,突厥原是它的锻奴属部。',
  f:{ '鼎盛':'5世纪', '中心':'漠北', '人物':'社崙可汗', '成就':'首创"可汗"称号' },
  d:'与北魏对峙一百五十年,北魏蔑称其为"蠕蠕"。首领社崙首创"可汗"这个称号,此后一千多年,从突厥、回鹘到蒙古、满洲,草原君主一律用它。它世代役使阿尔泰山南麓的突厥人为其锻铁,552年这群"锻奴"反戈,一战把它灭了。' },
{ l:'st', s:'steppe', v:1, n:'匈人', k:[[350,0],[440,.5],[470,0]], b:'阿提拉兵临罗马,搅动整个欧洲的民族大迁徙。',
  f:{ '鼎盛':'阿提拉(434—453)', '中心':'潘诺尼亚', '人物':'阿提拉' },
  d:'"上帝之鞭"阿提拉勒索东西两罗马、横扫巴尔干与高卢;沙隆一战受挫,暴亡后帝国立散。但他推动的多米诺——日耳曼各族涌入罗马境内——再也停不下来了。' },
{ l:'st', s:'steppe', v:0, n:'嚈哒·白匈奴', k:[[440,0],[500,.4],[560,0]], b:'同时压住萨珊波斯与笈多印度的中亚强权。',
  f:{ '鼎盛':'6世纪初', '中心':'巴克特里亚(今阿富汗北部)', '成就':'击杀萨珊国王、终结笈多盛世' },
  d:'来历至今没有定论——是不是匈奴的一支,学界争了一百年。可以确定的是它在一个世纪里同时压制了西边的萨珊波斯与南边的笈多印度:萨珊国王卑路斯战死在它手里,笈多王朝被它打断了脊梁。560年前后,突厥与萨珊南北夹击,它消失得和出现时一样突然。' },
{ l:'st', s:'steppe', v:0, n:'突厥汗国', k:[[552,0],[580,.6],[630,.4],[744,0]], b:'控扼草原丝路东西六千里;后裔西迁重塑西亚。',
  f:{ '鼎盛':'6世纪末', '中心':'鄂尔浑河谷', '成就':'突厥文碑铭(最早的草原文字之一)' },
  d:'阿史那氏崛起于金山(阿尔泰),疆域东抵辽海西至里海;分裂为东西两部后先后被唐所灭。鄂尔浑碑铭里"听信唐朝甘言而亡国"的自省,是草原民族最早的文字自述之一;其部众西迁的余波,数百年后彻底重塑了西亚。' },
{ l:'st', s:'steppe', v:1, n:'回鹘', k:[[744,0],[790,.35],[840,0]], b:'助唐平安史之乱;西迁后由游牧转农耕。',
  f:{ '鼎盛':'8世纪后期', '中心':'哈拉巴拉嘎斯', '成就':'草原最早的定居都城、摩尼教国教' },
  d:'助唐平定安史之乱,换来绢马贸易的丰厚利润,并在草原上建起罕见的定居都城;被黠戛斯击溃后西迁河西与塔里木,由游牧转农耕,是今日维吾尔族的直系先民。' },
{ l:'st', s:'mideast', v:0, n:'萨曼王朝', k:[[819,0],[900,.45],[960,.5],[999,0]], b:'布哈拉的波斯语复兴;伊本·西那与比鲁尼的摇篮。',
  f:{ '鼎盛':'10世纪', '中心':'布哈拉', '人物':'伊本·西那、比鲁尼、菲尔多西', '成就':'新波斯语文学复兴、《医典》' },
  d:'阿拉伯征服两百年后,波斯语改用阿拉伯字母,在布哈拉的宫廷里重新活了过来——菲尔多西的《列王纪》把波斯的记忆整个接住。同一片土地上,伊本·西那写出《医典》,此后六百年是欧洲医学院的教科书;比鲁尼算出了地球半径,还写了一部至今仍被引用的印度志。这一百多年里,伊斯兰世界的学术中心不在巴格达,在中亚。' },
{ l:'st', s:'steppe', v:0, n:'喀喇汗王朝', k:[[840,0],[960,.3],[1050,.45],[1141,.25],[1212,0]], b:'突厥人集体皈依伊斯兰的转折点。',
  f:{ '鼎盛':'11世纪', '中心':'喀什噶尔、八剌沙衮', '成就':'《突厥语大词典》《福乐智慧》' },
  d:'第一个皈依伊斯兰教的突厥王朝——在此之前突厥人信萨满、摩尼教和佛教。它把中亚从伊朗语世界变成突厥语世界:今天从土耳其一路到新疆的语言版图,起点在这里。《福乐智慧》与《突厥语大词典》是突厥语最早的两部大书,后者还是一部带地图的百科全书。' },
{ l:'st', s:'mideast', v:0, n:'花剌子模', k:[[1077,0],[1200,.5],[1220,.3],[1231,0]], b:'扣杀蒙古使者,把成吉思汗引向西方。',
  f:{ '鼎盛':'摩诃末(1200—1220)', '中心':'玉龙杰赤、撒马尔罕', '关键词':'一次外交事故引发的浩劫' },
  d:'从塞尔柱的一个总督府起家,百余年间做到中亚最强,末代君主摩诃末自比"第二亚历山大"。1218年他的边将扣留并处死了蒙古商队,继而杀掉来交涉的使节——成吉思汗倾国西征,三年之内玉龙杰赤、撒马尔罕、布哈拉尽成废墟,灌溉系统被毁后数百年未能恢复。中亚繁华的一次性终结,起因是一桩本可避免的外交事故。' },
{ l:'st', s:'steppe', v:1, n:'西辽·哈剌契丹', k:[[1124,0],[1141,.35],[1180,.3],[1218,0]], b:'契丹西迁重建国;一战震动整个伊斯兰世界。',
  f:{ '鼎盛':'耶律大石(1124—1143)', '中心':'虎思斡耳朵', '成就':'卡特万之战击败塞尔柱、多信仰共治' },
  d:'辽亡于金之后,耶律大石率残部万里西行,在中亚重建政权。1141年卡特万之战大败塞尔柱苏丹桑贾尔,消息辗转传到欧洲,被附会成东方有位基督教君主"祭司王约翰"正在夹击穆斯林——十字军因此盼了整整一个世纪的东方援军。它本身是佛教政权,却统治着大批穆斯林臣民,宗教上相当宽容。' },
{ l:'st', s:'steppe', v:2, n:'蒙古帝国', k:[[1206,0],[1227,.8],[1260,1],[1294,.9],[1368,.3],[1400,0]], b:'史上最大陆地帝国,从太平洋到多瑙河;蒙古治世重通商路。',
  f:{ '鼎盛':'1260年前后', '中心':'哈拉和林', '人物':'成吉思汗、忽必烈、拔都', '成就':'史上最大陆地帝国、驿站系统' },
  d:'成吉思汗整编草原诸部,子孙三代打下从太平洋到多瑙河的疆域。毁灭与联通并行:屠城无数,却也让驿路畅通、商旅无阻,马可·波罗与教皇使节皆循此东来。四大汗国分立后各自本地化,帝国如潮水退去——但欧亚大陆从此再未彻底隔绝。' },
{ l:'st', s:'steppe', v:0, n:'帖木儿帝国', k:[[1370,0],[1405,.6],[1450,.4],[1507,0]], b:'从德里到安卡拉无役不胜;撒马尔罕的辉煌。',
  f:{ '鼎盛':'1400年前后', '中心':'撒马尔罕', '人物':'帖木儿、兀鲁伯', '成就':'撒马尔罕建筑群、兀鲁伯天文台' },
  d:'瘸子帖木儿自认成吉思汗的继承者,从德里到安卡拉无役不胜,连奥斯曼苏丹也做了他的俘虏;正欲远征明朝时病逝军中。其孙兀鲁伯的天文表精确得令后世欧洲天文学家叹服,玄孙巴布尔南下印度,开创了莫卧儿王朝。' },
{ l:'st', s:'steppe', v:2, n:'哈萨克汗国', k:[[1465,0],[1520,.3],[1680,.25],[1750,.15],[1847,0]], b:'"脱离者"自立门户,三个玉兹构成今日哈萨克民族。',
  f:{ '鼎盛':'哈斯木汗(16世纪初)', '中心':'突厥斯坦城', '成就':'哈斯木汗法典、三玉兹格局' },
  d:'1465年两位苏丹率部脱离乌兹别克汗国东迁,"哈萨克"一词意为脱离者、自由人——一个民族的名字就是它的建国方式。大、中、小三个玉兹的划分延续至今,仍是哈萨克社会的底层结构。夹在东边的准噶尔与北边的沙俄之间,1723年准噶尔突袭造成的"大灾难之年"迫使它逐部向俄国求援,也就此走上被吞并的路。' },
{ l:'st', s:'mideast', v:0, n:'布哈拉·希瓦·浩罕三汗国', k:[[1500,0],[1600,.3],[1700,.2],[1800,.25],[1876,0]], b:'乌兹别克三汗国;丝路萧条后中亚最后的本土政权。',
  f:{ '鼎盛':'16世纪与19世纪初', '中心':'布哈拉、希瓦、浩罕', '关键词':'"大博弈"的棋盘' },

{ l:'st', s:'steppe', v:1, n:'准噶尔', k:[[1634,0],[1690,.3],[1758,0]], b:'最后的草原帝国,与清三朝拉锯七十年。',
